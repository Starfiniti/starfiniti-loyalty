name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build pinned dashboard image
        run: docker build --file apps/dashboard/Dockerfile --tag starfiniti-dashboard:ci .
      - name: Build pinned worker image
        run: docker build --file apps/worker/Dockerfile --tag starfiniti-worker:ci .

  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:validate
      - run: npm run secrets:scan
      - run: npm run audit:prod
      - run: npm run licenses
      - run: npm run woocommerce:package

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Replay migrations, seed, and run pgTAP
        run: npm run db:verify
      - name: Remove local database containers and volumes
        if: always()
        run: npm run db:stop

  woocommerce-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - name: minimum-hpos
            config: .wp-env.woocommerce-min.json
            hpos: yes
          - name: minimum-legacy
            config: .wp-env.woocommerce-min.json
            hpos: no
          - name: current-hpos
            config: .wp-env.woocommerce.json
            hpos: yes
          - name: current-legacy
            config: .wp-env.woocommerce.json
            hpos: no
    name: woocommerce-runtime (${{ matrix.runtime.name }})
    env:
      WP_ENV_HOME: ${{ github.workspace }}/.wp-env-home
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start pinned WordPress and WooCommerce runtime
        run: npx wp-env start --config "${{ matrix.runtime.config }}"
      - name: Activate connector and configure order storage
        run: |
          npx wp-env run cli --config "${{ matrix.runtime.config }}" wp plugin activate starfiniti-loyalty
          npx wp-env run cli --config "${{ matrix.runtime.config }}" wp plugin deactivate starfiniti-loyalty
          npx wp-env run cli --config "${{ matrix.runtime.config }}" wp plugin activate starfiniti-loyalty
          npx wp-env run cli --config "${{ matrix.runtime.config }}" wp option update woocommerce_custom_orders_table_enabled "${{ matrix.runtime.hpos }}"
          npx wp-env run cli --config "${{ matrix.runtime.config }}" wp option update starfiniti_runtime_expected_hpos "${{ matrix.runtime.hpos }}"
      - name: Install Slovenian runtime language
        run: npx wp-env run cli --config "${{ matrix.runtime.config }}" wp language core install sl_SI
      - name: Exercise native coupon order and reconciliation paths
        run: npx wp-env run cli --config "${{ matrix.runtime.config }}" wp eval-file wp-content/plugins/starfiniti-loyalty/tests/runtime-smoke.php
      - name: Remove WordPress runtime containers and volumes
        if: always()
        run: npx wp-env destroy --force --config "${{ matrix.runtime.config }}"
