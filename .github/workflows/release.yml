name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run db:validate
      - run: npm run secrets:scan
      - run: npm run audit:prod
      - run: npm run licenses
      - name: Replay migrations, seed, and run pgTAP
        run: npm run db:verify
      - name: Remove local database containers and volumes
        if: always()
        run: npm run db:stop
      - name: Build WooCommerce release artifact
        run: npm run woocommerce:package
      - name: Build immutable application images
        id: image_build
        shell: bash
        run: |
          dashboard="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loyalty-dashboard"
          worker="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loyalty-worker"
          docker build --file apps/dashboard/Dockerfile --tag "$dashboard:$GITHUB_SHA" --tag "$dashboard:$GITHUB_REF_NAME" .
          docker build --file apps/worker/Dockerfile --tag "$worker:$GITHUB_SHA" --tag "$worker:$GITHUB_REF_NAME" .
          echo "dashboard_name=$dashboard" >> "$GITHUB_OUTPUT"
          echo "worker_name=$worker" >> "$GITHUB_OUTPUT"
      - name: Generate dashboard CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image_build.outputs.dashboard_name }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: dist/loyalty-dashboard.cdx.json
          syft-version: v1.51.0
          upload-artifact: "false"
          upload-release-assets: "false"
      - name: Generate worker CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image_build.outputs.worker_name }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: dist/loyalty-worker.cdx.json
          syft-version: v1.51.0
          upload-artifact: "false"
          upload-release-assets: "false"
      - name: Write release checksums
        shell: bash
        run: sha256sum dist/starfiniti-loyalty.zip dist/loyalty-dashboard.cdx.json dist/loyalty-worker.cdx.json > dist/SHA256SUMS
      - name: Authenticate to GitHub Container Registry
        shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable application images and capture digests
        id: images
        shell: bash
        env:
          DASHBOARD_IMAGE: ${{ steps.image_build.outputs.dashboard_name }}
          WORKER_IMAGE: ${{ steps.image_build.outputs.worker_name }}
        run: |
          dashboard="$DASHBOARD_IMAGE"
          worker="$WORKER_IMAGE"
          docker push "$dashboard:$GITHUB_SHA"
          docker push "$dashboard:$GITHUB_REF_NAME"
          docker push "$worker:$GITHUB_SHA"
          docker push "$worker:$GITHUB_REF_NAME"
          dashboard_reference="$(docker inspect --format='{{index .RepoDigests 0}}' "$dashboard:$GITHUB_SHA")"
          worker_reference="$(docker inspect --format='{{index .RepoDigests 0}}' "$worker:$GITHUB_SHA")"
          dashboard_digest="${dashboard_reference#*@}"
          worker_digest="${worker_reference#*@}"
          [[ "$dashboard_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$worker_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "dashboard_name=$dashboard" >> "$GITHUB_OUTPUT"
          echo "dashboard_digest=$dashboard_digest" >> "$GITHUB_OUTPUT"
          echo "worker_name=$worker" >> "$GITHUB_OUTPUT"
          echo "worker_digest=$worker_digest" >> "$GITHUB_OUTPUT"
      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/starfiniti-loyalty.zip
            dist/loyalty-dashboard.cdx.json
            dist/loyalty-worker.cdx.json
            dist/SHA256SUMS
      - name: Attest dashboard image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.dashboard_name }}
          subject-digest: ${{ steps.images.outputs.dashboard_digest }}
          push-to-registry: true
      - name: Attest worker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.worker_name }}
          subject-digest: ${{ steps.images.outputs.worker_digest }}
          push-to-registry: true
      - name: Publish GitHub release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/starfiniti-loyalty.zip dist/loyalty-dashboard.cdx.json dist/loyalty-worker.cdx.json dist/SHA256SUMS --verify-tag --generate-notes --title "Starfiniti Loyalty $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
