name: Release

on:
  repository_dispatch:
    types: [release]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    outputs:
      candidate_sha: ${{ steps.authority.outputs.candidate_sha }}
      release_tag: ${{ steps.authority.outputs.release_tag }}
    steps:
      - name: Validate protected release authority
        id: authority
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "RELEASE_POLICY_TOKEN must have read-only Administration, Actions, Checks, Code scanning alerts, Commit statuses, Contents, Dependabot alerts, and Secret scanning alerts access." >&2
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

          repository="$GITHUB_REPOSITORY"
          api_version="2026-03-10"
          main_sha="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$CANDIDATE_SHA" ]]

          tag_ref="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/git/ref/tags/$RELEASE_TAG")"
          [[ "$(jq -r '.object.type' <<<"$tag_ref")" == "tag" ]]
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
          tag_object="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/git/tags/$tag_object_sha")"
          [[ "$(jq -r '.tag' <<<"$tag_object")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.object.type' <<<"$tag_object")" == "commit" ]]
          [[ "$(jq -r '.object.sha' <<<"$tag_object")" == "$CANDIDATE_SHA" ]]
          [[ "$(jq -r '.verification.verified' <<<"$tag_object")" == "true" ]]

          release_tags="$(gh api --paginate -H "X-GitHub-Api-Version: $api_version" "repos/$repository/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fqx "$RELEASE_TAG" <<<"$release_tags"; then
            echo "A release for $RELEASE_TAG already exists." >&2
            exit 1
          fi

          protection="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/branches/main/protection")"
          jq -e '
            .required_status_checks.strict == true and
            .required_signatures.enabled == true and
            .required_pull_request_reviews.required_approving_review_count == 1 and
            .required_pull_request_reviews.dismiss_stale_reviews == true and
            .required_pull_request_reviews.require_last_push_approval == true and
            .required_conversation_resolution.enabled == true and
            .enforce_admins.enabled == true and
            .allow_force_pushes.enabled == false and
            .allow_deletions.enabled == false and
            ([.required_status_checks.contexts[]] | sort) ==
              ([
                "CodeQL",
                "baseline",
                "codeql",
                "containers",
                "dast",
                "database",
                "recovery-transport",
                "supply-chain",
                "woocommerce-runtime (current-hpos)",
                "woocommerce-runtime (current-legacy)",
                "woocommerce-runtime (minimum-hpos)",
                "woocommerce-runtime (minimum-legacy)"
              ] | sort) and
            ([.required_status_checks.checks[] | {context, app_id}] | sort_by(.context, .app_id)) ==
              ([
                {context: "CodeQL", app_id: 57789},
                {context: "baseline", app_id: 15368},
                {context: "codeql", app_id: 15368},
                {context: "containers", app_id: 15368},
                {context: "dast", app_id: 15368},
                {context: "database", app_id: 15368},
                {context: "recovery-transport", app_id: 15368},
                {context: "supply-chain", app_id: 15368},
                {context: "woocommerce-runtime (current-hpos)", app_id: 15368},
                {context: "woocommerce-runtime (current-legacy)", app_id: 15368},
                {context: "woocommerce-runtime (minimum-hpos)", app_id: 15368},
                {context: "woocommerce-runtime (minimum-legacy)", app_id: 15368}
              ] | sort_by(.context, .app_id))
          ' <<<"$protection" >/dev/null

          check_runs="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/commits/$CANDIDATE_SHA/check-runs?per_page=100")"
          statuses="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/commits/$CANDIDATE_SHA/statuses?per_page=100")"
          mapfile -t required_contexts < <(
            jq -r '.required_status_checks.contexts[]?' <<<"$protection"
          )
          for context in "${required_contexts[@]}"; do
            if jq -e --arg context "$context" '
              any(.check_runs[]?; .name == $context and .status == "completed" and .conclusion == "success")
            ' <<<"$check_runs" >/dev/null; then
              continue
            fi
            jq -e --arg context "$context" '
              any(.[]?; .context == $context and .state == "success")
            ' <<<"$statuses" >/dev/null || {
              echo "Required check $context is not successful on $CANDIDATE_SHA." >&2
              exit 1
            }
          done
          mapfile -t required_checks < <(
            jq -c '.required_status_checks.checks[]?' <<<"$protection"
          )
          for required_check in "${required_checks[@]}"; do
            context="$(jq -r '.context' <<<"$required_check")"
            app_id="$(jq -r '.app_id' <<<"$required_check")"
            jq -e --arg context "$context" --argjson appId "$app_id" '
              any(.check_runs[]?;
                .name == $context and
                ($appId == -1 or .app.id == $appId) and
                .status == "completed" and
                .conclusion == "success"
              )
            ' <<<"$check_runs" >/dev/null || {
              echo "Required app-bound check $context is not successful on $CANDIDATE_SHA." >&2
              exit 1
            }
          done

          creation_ruleset_id=""
          immutability_ruleset_id=""
          while IFS= read -r ruleset_id; do
            ruleset="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/rulesets/$ruleset_id")"
            if jq -e '
              .name == "Release tag creation authority" and
              .target == "tag" and
              .enforcement == "active" and
              .conditions.ref_name.include == ["refs/tags/v*.*.*"] and
              (.conditions.ref_name.exclude | length) == 0 and
              ([.rules[].type] | sort) == ["creation"] and
              (.bypass_actors // []) == [{
                actor_id: 120020919,
                actor_type: "User",
                bypass_mode: "always"
              }]
            ' <<<"$ruleset" >/dev/null; then
              [[ -z "$creation_ruleset_id" ]]
              creation_ruleset_id="$ruleset_id"
            fi
            if jq -e '
              .name == "Signed immutable release tags" and
              .target == "tag" and
              .enforcement == "active" and
              .conditions.ref_name.include == ["refs/tags/v*.*.*"] and
              (.conditions.ref_name.exclude | length) == 0 and
              ([.rules[].type] | sort) == (["update", "deletion", "required_signatures"] | sort) and
              ((.bypass_actors // []) | length) == 0
            ' <<<"$ruleset" >/dev/null; then
              [[ -z "$immutability_ruleset_id" ]]
              immutability_ruleset_id="$ruleset_id"
            fi
          done < <(
            gh api --paginate -H "X-GitHub-Api-Version: $api_version" "repos/$repository/rulesets?includes_parents=true" \
              --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id'
          )
          [[ -n "$creation_ruleset_id" ]]
          [[ -n "$immutability_ruleset_id" ]]
          [[ "$creation_ruleset_id" != "$immutability_ruleset_id" ]]

          repository_security="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository")"
          jq -e '
            .security_and_analysis.dependabot_security_updates.status == "enabled" and
            .security_and_analysis.secret_scanning.status == "enabled" and
            .security_and_analysis.secret_scanning_push_protection.status == "enabled"
          ' <<<"$repository_security" >/dev/null

          actions_policy="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/actions/permissions")"
          jq -e '
            .enabled == true and
            .allowed_actions == "selected" and
            .sha_pinning_required == true
          ' <<<"$actions_policy" >/dev/null
          selected_actions="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/actions/permissions/selected-actions")"
          jq -e '
            .github_owned_allowed == false and
            .verified_allowed == false and
            (.patterns_allowed | sort) == ([
              "actions/attest-build-provenance@*",
              "actions/checkout@*",
              "actions/download-artifact@*",
              "actions/setup-node@*",
              "actions/upload-artifact@*",
              "anchore/sbom-action@*",
              "aquasecurity/trivy-action@*",
              "github/codeql-action@*"
            ] | sort)
          ' <<<"$selected_actions" >/dev/null

          gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/vulnerability-alerts" >/dev/null
          dependabot_updates="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/automated-security-fixes")"
          jq -e '.enabled == true and .paused == false' <<<"$dependabot_updates" >/dev/null
          private_reporting="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/private-vulnerability-reporting")"
          jq -e '.enabled == true' <<<"$private_reporting" >/dev/null

          open_secret_alerts="$(gh api --paginate -H "X-GitHub-Api-Version: $api_version" "repos/$repository/secret-scanning/alerts?state=open&per_page=100" --jq '.[].number')"
          open_dependabot_alerts="$(gh api --paginate -H "X-GitHub-Api-Version: $api_version" "repos/$repository/dependabot/alerts?state=open&per_page=100" --jq '.[].number')"
          open_code_alerts="$(gh api --paginate -H "X-GitHub-Api-Version: $api_version" "repos/$repository/code-scanning/alerts?state=open&per_page=100" --jq '.[].number')"
          [[ -z "$open_secret_alerts" ]]
          [[ -z "$open_dependabot_alerts" ]]
          [[ -z "$open_code_alerts" ]]

          release_environment="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$repository/environments/release")"
          jq -e '
            .name == "release" and
            any(.protection_rules[]?;
              .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | length) > 0
            ) and
            .deployment_branch_policy.protected_branches == true and
            .deployment_branch_policy.custom_branch_policies == false
          ' <<<"$release_environment" >/dev/null

          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:validate
      - run: npm run secrets:scan
      - run: npm run audit:prod
      - run: npm run licenses
      - name: Replay migrations, seed, and run pgTAP
        run: npm run db:verify
      - name: Remove local database containers and volumes
        if: always()
        run: npm run db:stop
      - name: Build WooCommerce release artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          npm run woocommerce:package -- --version "$version"
          npm run woocommerce:package:verify -- --archive dist/starfiniti-loyalty.zip --version "$version"
      - name: Build immutable application images
        id: image_build
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          dashboard="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loyalty-dashboard"
          worker="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loyalty-worker"
          docker build --file apps/dashboard/Dockerfile --tag "$dashboard:$CANDIDATE_SHA" --tag "$dashboard:$RELEASE_TAG" .
          docker build --file apps/worker/Dockerfile --tag "$worker:$CANDIDATE_SHA" --tag "$worker:$RELEASE_TAG" .
          echo "dashboard_name=$dashboard" >> "$GITHUB_OUTPUT"
          echo "worker_name=$worker" >> "$GITHUB_OUTPUT"
      - name: Generate dashboard CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image_build.outputs.dashboard_name }}:${{ needs.preflight.outputs.candidate_sha }}
          format: cyclonedx-json
          output-file: dist/loyalty-dashboard.cdx.json
          syft-version: v1.51.0
          upload-artifact: "false"
          upload-release-assets: "false"
      - name: Generate worker CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image_build.outputs.worker_name }}:${{ needs.preflight.outputs.candidate_sha }}
          format: cyclonedx-json
          output-file: dist/loyalty-worker.cdx.json
          syft-version: v1.51.0
          upload-artifact: "false"
          upload-release-assets: "false"
      - name: Build exact corresponding source release artifacts
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          source_date_epoch="$(git show -s --format=%ct "$CANDIDATE_SHA")"
          npm run release:sources:build -- \
            --dashboard-sbom dist/loyalty-dashboard.cdx.json \
            --worker-sbom dist/loyalty-worker.cdx.json \
            --candidate-commit "$CANDIDATE_SHA" \
            --tag "$RELEASE_TAG" \
            --source-date-epoch "$source_date_epoch" \
            --output-dir dist
      - name: Verify exact corresponding source release artifacts
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          source_date_epoch="$(git show -s --format=%ct "$CANDIDATE_SHA")"
          npm run release:sources:verify -- \
            --dashboard-sbom dist/loyalty-dashboard.cdx.json \
            --worker-sbom dist/loyalty-worker.cdx.json \
            --candidate-commit "$CANDIDATE_SHA" \
            --tag "$RELEASE_TAG" \
            --source-date-epoch "$source_date_epoch" \
            --output-dir dist
      - name: Write release checksums
        shell: bash
        run: |
          sha256sum \
            dist/starfiniti-loyalty.zip \
            dist/loyalty-dashboard.cdx.json \
            dist/loyalty-worker.cdx.json \
            dist/starfiniti-loyalty-source.tar.gz \
            dist/starfiniti-loyalty-source-manifest.json \
            dist/starfiniti-loyalty-third-party-notices.md \
            > dist/SHA256SUMS
      - name: Seal publication bundle
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          DASHBOARD_IMAGE: ${{ steps.image_build.outputs.dashboard_name }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          WORKER_IMAGE: ${{ steps.image_build.outputs.worker_name }}
        run: |
          docker save \
            "$DASHBOARD_IMAGE:$CANDIDATE_SHA" \
            "$DASHBOARD_IMAGE:$RELEASE_TAG" \
            "$WORKER_IMAGE:$CANDIDATE_SHA" \
            "$WORKER_IMAGE:$RELEASE_TAG" \
            --output dist/loyalty-images.tar
          jq -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg dashboardImage "$DASHBOARD_IMAGE" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg workerImage "$WORKER_IMAGE" \
            '{
              schema: "starfiniti.release-publication-bundle.v1",
              candidateSha: $candidateSha,
              releaseTag: $releaseTag,
              dashboardImage: $dashboardImage,
              workerImage: $workerImage
            }' > dist/release-metadata.json
          sha256sum \
            dist/starfiniti-loyalty.zip \
            dist/loyalty-dashboard.cdx.json \
            dist/loyalty-worker.cdx.json \
            dist/starfiniti-loyalty-source.tar.gz \
            dist/starfiniti-loyalty-source-manifest.json \
            dist/starfiniti-loyalty-third-party-notices.md \
            dist/SHA256SUMS \
            dist/loyalty-images.tar \
            dist/release-metadata.json \
            > dist/BUILD_SHA256SUMS
      - name: Upload sealed publication bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.preflight.outputs.candidate_sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Download sealed publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.7
        with:
          name: release-candidate-${{ needs.preflight.outputs.candidate_sha }}
          path: dist
      - name: Verify sealed publication bundle
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          server_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.digest')"
          [[ "$server_digest" == "sha256:$ARTIFACT_DIGEST" ]]
          expected_files="$(printf '%s\n' \
            BUILD_SHA256SUMS SHA256SUMS loyalty-dashboard.cdx.json \
            loyalty-images.tar loyalty-worker.cdx.json release-metadata.json \
            starfiniti-loyalty-source-manifest.json starfiniti-loyalty-source.tar.gz \
            starfiniti-loyalty-third-party-notices.md starfiniti-loyalty.zip | sort)"
          actual_entries="$(find dist -mindepth 1 -printf '%P\n' | sort)"
          [[ "$actual_entries" == "$expected_files" ]]
          sha256sum --check dist/BUILD_SHA256SUMS
          sha256sum --check dist/SHA256SUMS
          jq -e \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg dashboardImage "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loyalty-dashboard" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg workerImage "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loyalty-worker" '
              keys == ["candidateSha", "dashboardImage", "releaseTag", "schema", "workerImage"] and
              .schema == "starfiniti.release-publication-bundle.v1" and
              .candidateSha == $candidateSha and
              .releaseTag == $releaseTag and
              .dashboardImage == $dashboardImage and
              .workerImage == $workerImage
            ' dist/release-metadata.json >/dev/null
      - name: Revalidate immutable release authority
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          main_sha="$(gh api "repos/$repository/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$CANDIDATE_SHA" ]]
          tag_ref="$(gh api "repos/$repository/git/ref/tags/$RELEASE_TAG")"
          [[ "$(jq -r '.object.type' <<<"$tag_ref")" == "tag" ]]
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
          tag_object="$(gh api "repos/$repository/git/tags/$tag_object_sha")"
          [[ "$(jq -r '.tag' <<<"$tag_object")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.object.sha' <<<"$tag_object")" == "$CANDIDATE_SHA" ]]
          [[ "$(jq -r '.verification.verified' <<<"$tag_object")" == "true" ]]
          release_tags="$(gh api --paginate "repos/$repository/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fqx "$RELEASE_TAG" <<<"$release_tags"; then
            echo "A release for $RELEASE_TAG already exists." >&2
            exit 1
          fi
      - name: Load prebuilt application images
        shell: bash
        run: docker load --input dist/loyalty-images.tar
      - name: Authenticate to GitHub Container Registry
        shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable application images and capture digests
        id: images
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          dashboard="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loyalty-dashboard"
          worker="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loyalty-worker"
          docker push "$dashboard:$CANDIDATE_SHA"
          docker push "$dashboard:$RELEASE_TAG"
          docker push "$worker:$CANDIDATE_SHA"
          docker push "$worker:$RELEASE_TAG"
          dashboard_reference="$(docker inspect --format='{{index .RepoDigests 0}}' "$dashboard:$CANDIDATE_SHA")"
          worker_reference="$(docker inspect --format='{{index .RepoDigests 0}}' "$worker:$CANDIDATE_SHA")"
          dashboard_digest="${dashboard_reference#*@}"
          worker_digest="${worker_reference#*@}"
          [[ "$dashboard_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$worker_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "dashboard_name=$dashboard" >> "$GITHUB_OUTPUT"
          echo "dashboard_digest=$dashboard_digest" >> "$GITHUB_OUTPUT"
          echo "worker_name=$worker" >> "$GITHUB_OUTPUT"
          echo "worker_digest=$worker_digest" >> "$GITHUB_OUTPUT"
      - name: Attest release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/starfiniti-loyalty.zip
            dist/loyalty-dashboard.cdx.json
            dist/loyalty-worker.cdx.json
            dist/starfiniti-loyalty-source.tar.gz
            dist/starfiniti-loyalty-source-manifest.json
            dist/starfiniti-loyalty-third-party-notices.md
            dist/SHA256SUMS
      - name: Attest dashboard image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.dashboard_name }}
          subject-digest: ${{ steps.images.outputs.dashboard_digest }}
          push-to-registry: true
      - name: Attest worker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.worker_name }}
          subject-digest: ${{ steps.images.outputs.worker_digest }}
          push-to-registry: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/starfiniti-loyalty.zip \
            dist/loyalty-dashboard.cdx.json \
            dist/loyalty-worker.cdx.json \
            dist/starfiniti-loyalty-source.tar.gz \
            dist/starfiniti-loyalty-source-manifest.json \
            dist/starfiniti-loyalty-third-party-notices.md \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Starfiniti Loyalty $RELEASE_TAG"
