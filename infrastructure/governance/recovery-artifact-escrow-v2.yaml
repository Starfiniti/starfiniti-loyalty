automaticFails:
  - the V1 policy or evidence differs from its accepted immutable digest or the V2 extension differs from the exact reviewed contract
  - a required entry is absent extra duplicated case-colliding linked special mutable over-bound or digest-different
  - a fixed artifact differs from its candidate plan or a repository instruction differs from the clean exact Git commit
  - an rsync candidate dependency or rollback package is absent substituted reordered or detached from the exact endpoint plan
  - a private-manifest-bound key or dependency inventory is missing malformed empty or represented as independently reviewed
  - a minimized report contains private paths identities endpoints raw content or production authority
  - inventory verification is presented as package-authority compatibility offline-custody signing-fingerprint dependency second-person isolated-restore production activation or operations-escrow completion
