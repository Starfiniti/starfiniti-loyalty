automaticFails:
  - the bundle policy or private manifest differs from the exact reviewed contract
  - a required entry is absent extra duplicated case-colliding linked special mutable over-bound or digest-different
  - a fixed artifact differs from its candidate plan or a repository instruction differs from the clean exact Git commit
  - a private-manifest-bound key or dependency inventory is missing malformed empty or represented as independently reviewed
  - a minimized report contains private paths identities endpoints raw content or production authority
  - inventory verification is presented as offline custody signing-fingerprint dependency second-person production activation or operations escrow completion
