approach:
  compared:
    - id: exact-disposable-runtime-rehearsal
      strength: proves migration runtime outposts protocols recovery and rollback together
      limitation: requires private configuration image and outpost inventory plus isolated recovery inputs not present in repository evidence
    - id: immutable-source-and-openapi-contract
      strength: proves the exact candidate source and every repository-owned admin request stays structurally supported without production access
      limitation: cannot prove migrations runtime behavior provider traffic outposts recovery or rollback
  chosen: immutable-source-and-openapi-contract
  rationale: Close the deterministic source-contract question now while retaining the stronger exact disposable runtime rehearsal as a mandatory candidate gate.
