automaticFails:
  - the accepted V1 or V2 policy or evidence differs from its immutable digest or the V3 extension differs from the exact reviewed contract
  - the historical cross-suite rsync package candidate is treated as active eligible or equivalent to the native source-built candidate
  - a required entry is absent extra duplicated case-colliding linked special mutable over-bound or digest-different
  - a native executable shared wrapper source signature release key rollback package or retained canary report differs from the exact candidate plan and evidence
  - a repository instruction differs from the clean exact Git commit or a private dependency inventory is missing malformed empty or represented as independently reviewed
  - a minimized report contains private paths identities endpoints raw content or production authority
  - inventory verification is presented as source signature native build package authority compatibility custody second-person restore activation or operations-escrow completion
  - a production selector changes before V3 private inventory redundant custody independent review real forced-command manual and timer archive and isolated restore gates pass
