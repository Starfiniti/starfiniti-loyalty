services:
  dashboard:
    image: ${DASHBOARD_IMAGE:?set DASHBOARD_IMAGE to an immutable tag}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?required}
      DASHBOARD_PUBLIC_ORIGIN: ${DASHBOARD_PUBLIC_ORIGIN:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
      WOOCOMMERCE_SIGNING_MATERIAL_FILE: /run/secrets/woocommerce_signing_material
      LOYALTY_FEDERATION_CONFIG_FILE: /run/secrets/federation_management_config
      LOYALTY_AUTHENTIK_API_TOKEN_FILE: /run/secrets/authentik_federation_token
      LOYALTY_SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      LOYALTY_STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      LOYALTY_STRIPE_API_KEY_FILE: /run/secrets/stripe_api_key
    extra_hosts:
      - "${SUPABASE_PUBLIC_HOST:?required}:${SUPABASE_INTERNAL_PROXY_IP:?required}"
    secrets:
      - woocommerce_signing_material
      - federation_management_config
      - authentik_federation_token
      - supabase_service_role_key
    volumes:
      - ${LOYALTY_STRIPE_WEBHOOK_SECRET_PATH:-/dev/null}:/run/secrets/stripe_webhook_secret:ro
      - ${LOYALTY_STRIPE_API_KEY_PATH:-/dev/null}:/run/secrets/stripe_api_key:ro
    ports:
      - "${DASHBOARD_BIND_ADDRESS:?set a loopback or private IPv4 address}:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:3000/api/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${WORKER_IMAGE:?set WORKER_IMAGE to an immutable tag}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      LOYALTY_WORKER_DATABASE_URL: ${LOYALTY_WORKER_DATABASE_URL:?required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 75s

  notification-worker:
    profiles: ["smtp"]
    image: ${WORKER_IMAGE:?set WORKER_IMAGE to an immutable tag}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      LOYALTY_WORKER_MODE: notification
      LOYALTY_WORKER_DATABASE_URL: ${LOYALTY_WORKER_DATABASE_URL:?required}
      LOYALTY_SMTP_ENABLED: "true"
      LOYALTY_SMTP_HOST: ${LOYALTY_SMTP_HOST:-127.0.0.1}
      LOYALTY_SMTP_PORT: ${LOYALTY_SMTP_PORT:-587}
      LOYALTY_SMTP_SECURITY: ${LOYALTY_SMTP_SECURITY:-starttls}
      LOYALTY_SMTP_FROM_ADDRESS: ${LOYALTY_SMTP_FROM_ADDRESS:-loyalty@localhost.invalid}
      LOYALTY_SMTP_USERNAME: ${LOYALTY_SMTP_USERNAME:-}
      LOYALTY_SMTP_PASSWORD_FILE: ${LOYALTY_SMTP_PASSWORD_FILE:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 75s

  klaviyo-worker:
    profiles: ["klaviyo"]
    image: ${WORKER_IMAGE:?set WORKER_IMAGE to an immutable tag}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      LOYALTY_WORKER_MODE: klaviyo
      LOYALTY_WORKER_DATABASE_URL: ${LOYALTY_WORKER_DATABASE_URL:?required}
      LOYALTY_KLAVIYO_ENABLED: "true"
      LOYALTY_KLAVIYO_CONNECTION_ID: ${LOYALTY_KLAVIYO_CONNECTION_ID:-00000000-0000-0000-0000-000000000000}
      LOYALTY_KLAVIYO_API_KEY_FILE: /run/secrets/klaviyo_api_key
    volumes:
      - ${LOYALTY_KLAVIYO_API_KEY_PATH:-/dev/null}:/run/secrets/klaviyo_api_key:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 75s

  webhook-worker:
    profiles: ["webhook"]
    image: ${WORKER_IMAGE:?set WORKER_IMAGE to an immutable tag}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      LOYALTY_WORKER_MODE: webhook
      LOYALTY_WORKER_DATABASE_URL: ${LOYALTY_WORKER_DATABASE_URL:?required}
      LOYALTY_WEBHOOK_ENABLED: "true"
      LOYALTY_WEBHOOK_ENDPOINT_ID: ${LOYALTY_WEBHOOK_ENDPOINT_ID:-00000000-0000-0000-0000-000000000000}
      LOYALTY_WEBHOOK_ALLOWED_ORIGIN: ${LOYALTY_WEBHOOK_ALLOWED_ORIGIN:-https://invalid.example}
      LOYALTY_WEBHOOK_CURRENT_SECRET_FILE: /run/secrets/webhook_current_secret
      LOYALTY_WEBHOOK_PREVIOUS_SECRET_FILE: ${LOYALTY_WEBHOOK_PREVIOUS_SECRET_FILE:-}
    volumes:
      - ${LOYALTY_WEBHOOK_CURRENT_SECRET_PATH:-/dev/null}:/run/secrets/webhook_current_secret:ro
      - ${LOYALTY_WEBHOOK_PREVIOUS_SECRET_PATH:-/dev/null}:/run/secrets/webhook_previous_secret:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 75s

  reporting-worker:
    profiles: ["reporting"]
    image: ${WORKER_IMAGE:?set WORKER_IMAGE to an immutable tag}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      LOYALTY_WORKER_MODE: reporting
      LOYALTY_WORKER_DATABASE_URL: ${LOYALTY_WORKER_DATABASE_URL:?required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 75s

  billing-worker:
    profiles: ["billing"]
    image: ${WORKER_IMAGE:?set WORKER_IMAGE to an immutable tag}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      LOYALTY_WORKER_MODE: billing
      LOYALTY_WORKER_DATABASE_URL: ${LOYALTY_WORKER_DATABASE_URL:?required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 75s

secrets:
  woocommerce_signing_material:
    file: ${WOOCOMMERCE_SIGNING_MATERIAL_PATH:?required}
  federation_management_config:
    file: ${LOYALTY_FEDERATION_CONFIG_PATH:?required}
  authentik_federation_token:
    file: ${LOYALTY_AUTHENTIK_API_TOKEN_PATH:?required}
  supabase_service_role_key:
    file: ${LOYALTY_SUPABASE_SERVICE_ROLE_KEY_PATH:?required}
