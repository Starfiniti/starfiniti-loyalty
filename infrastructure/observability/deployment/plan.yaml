policy:
  administrationBind: 127.0.0.1
  publishedServices: [prometheus, alertmanager, grafana]
  unpublishedServices: [blackbox-exporter, postgres-exporter]
  centralServices:
    [prometheus, alertmanager, grafana, blackbox-exporter, postgres-exporter]
  centralNetworks: [monitoring-control, monitoring-egress]
  requiredHardening:
    [
      read_only_root,
      drop_all_capabilities,
      no_new_privileges,
      resource_limits,
      bounded_logs,
    ]
  forbidden:
    [
      latest_tag,
      privileged,
      host_network,
      host_pid,
      host_ipc,
      docker_socket,
      embedded_receiver,
      embedded_target,
      embedded_credential,
    ]
  operatorPaths:
    [
      STARFINITI_ALERTMANAGER_CONFIG,
      STARFINITI_GRAFANA_ADMIN_PASSWORD_FILE,
      STARFINITI_POSTGRES_EXPORTER_CONFIG,
      STARFINITI_PROMETHEUS_TARGETS_DIR,
    ]
  hostExporterCollectors: [textfile]
  hostExporterTextfileDirectory: /var/lib/node_exporter/textfile_collector
  productionAuthority: false
canary:
  environment: disposable-github-linux-amd64
  publicIngress: false
  productionRoute: false
  realCredential: false
  rawTargetRetention: false
  exactVersionRequired: true
  exactTeardownRequired: true
