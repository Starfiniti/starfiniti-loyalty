  - https://github.com/goauthentik/authentik/blob/f3753ec20ce13ef672401a131379d1a5a2d3439b/authentik/lib/sync/outgoing/models.py
  - https://github.com/goauthentik/authentik/blob/f3753ec20ce13ef672401a131379d1a5a2d3439b/authentik/lib/sync/outgoing/tasks.py
  - https://github.com/goauthentik/authentik/blob/f3753ec20ce13ef672401a131379d1a5a2d3439b/authentik/providers/scim/management/commands/scim_sync.py
  - https://supabase.com/docs/guides/self-hosting/self-hosted-oauth
  - https://supabase.com/docs/guides/auth/sessions
limitations:
  - Uses only synthetic identities and an RFC-focused SCIM sink.
  - Does not exercise a real enterprise IdP tenant or the production Authentik deployment.
  - Does not replace database RLS SCIM stale-session or cross-tenant acceptance evidence.
  - Must not change any M13 production canary check from pending to passed.
