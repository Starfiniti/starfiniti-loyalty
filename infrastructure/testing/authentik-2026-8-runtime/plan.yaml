isolation:
  networkInternal: true
  publishedHostPorts: 0
  dockerSocketMounted: false
  hostBindMounts:
    - repository source files read-only
  productionRoutesAllowed: false
  productionCredentialsAllowed: false
  syntheticCredentialsOnly: true
  removeContainersAndNetworkAlways: true
  pullImagesBeforeIsolation: true
runtime:
  platform: linux/amd64
  startupTimeoutSeconds: 300
  scenarioTimeoutSeconds: 180
  maximumReportBytes: 65536
  reportPathPattern: dist/authentik-2026-8-runtime/[a-z0-9][a-z0-9._-]{1,79}.json
  authentikHealthPaths:
    - /-/health/live/
    - /-/health/ready/
  authentikApiOrigin: http://authentik-runtime-server:9000
  scimBaseUrl: http://scim-runtime-sink:8080/v2
  supabaseCallbackUrl: https://supabase.runtime.invalid/auth/v1/callback
scenarios:
  - id: R01-EXACT-IMAGE-IDENTITY
    proves: Every runtime image resolves to the reviewed Linux/amd64 manifest.
  - id: R02-ISOLATED-BOOT-AND-HEALTH
    proves: PostgreSQL Authentik server worker and the SCIM sink start without a production route.
  - id: R03-OIDC-DISABLED-RECONCILIATION
    proves: The production federation client creates a disabled OIDC source and dedicated source-only flow.
  - id: R04-IDEMPOTENT-SECRET-ROTATION
    proves: Reconciliation and OIDC secret rotation preserve resource identity and exactly two flow bindings.
  - id: R05-SAML-DISABLED-RECONCILIATION
    proves: The production federation client creates a disabled signed SAML source using a public synthetic certificate.
  - id: R06-DOWNSTREAM-OIDC-INVARIANTS
    proves: The hidden downstream provider uses authorization code hashed subject and one strict Supabase callback.
  - id: R07-DOWNSTREAM-OIDC-DISCOVERY
    proves: Candidate discovery metadata exposes the expected issuer and authorization code endpoints.
  - id: R08-SCIM-BEARER-FAIL-CLOSED
    proves: A missing or incorrect SCIM bearer token is rejected before resource access.
  - id: R09-SCIM-DISCOVERY-AND-PAGINATION
    proves: The exact SCIM schedule is triggered through Authentik's permissioned schedule API before ServiceProviderConfig discovery and bounded startIndex and count pagination.
  - id: R10-SCIM-USER-GROUP-PROVISIONING
    proves: A synthetic Authentik user and group reach the SCIM sink with candidate externalId semantics.
  - id: R11-SCIM-GROUP-MEMBERSHIP
    proves: Candidate group provisioning links the remotely assigned user identifier.
  - id: R12-SCIM-MEMBERSHIP-REMOVAL
    proves: Removing group membership sends the quoted RFC 7644 member removal path.
  - id: R13-SCIM-DEPROVISIONING
    proves: Deactivation is delivered as active false without granting Starfiniti tenant authority.
  - id: R14-TEARDOWN-AND-MINIMIZATION
    proves: Disposable resources are removed and the report contains no token secret PII or raw response.
report:
  schema: starfiniti.authentik-2026-8-runtime-report.v1
  minimumPassedScenarios: 14
  forbiddenKeys:
    - token
    - secret
    - password
    - email
    - username
    - name
    - raw
    - body
    - response
  forbiddenValues:
    - loyalty.starfiniti.com
    - auth.starfiniti.com
    - api.loyalty.starfiniti.com
