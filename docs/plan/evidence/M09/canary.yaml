automaticFails:
  - id: browser_scope_authority
    rule: "browser route query form preview cache or mutable identity claim chooses tenant customer channel wallet programme balance reward or value authority"
  - id: cross_tenant_exposure
    rule: "an unrelated tenant programme customer snapshot presentation reservation coupon queue or internal selector becomes visible mutable or externally actionable"
  - id: stale_snapshot_value_authority
    rule: "stale malformed conflicting older or cross-connection local snapshot replaces the last valid cache or grants affordability redemption or coupon authority"
  - id: duplicate_value_effect
    rule: "retry concurrent delivery outage recovery or presentation action creates another ledger reservation coupon command or native value effect"
  - id: checkout_dependency
    rule: "WooCommerce checkout synchronously depends on Hub DNS application worker entitlement presentation provider snapshot or progressive panel availability"
  - id: public_customer_exposure
    rule: "anonymous or public output reveals customer order balance referral reservation coupon identity or private authority evidence"
  - id: uncontrolled_asset_or_script
    rule: "merchant copy markup URL asset script style remote content or unbounded progressive payload escapes the controlled presentation contract"
  - id: accessibility_regression
    rule: "a critical keyboard screen-reader focus contrast zoom reflow reduced-motion mobile or no-script task remains inaccessible"
  - id: language_scope_drift
    rule: "a non-English route locale selector switcher or hidden active customer-language path enters the English-only product"
  - id: native_coupon_loss
    rule: "presentation disablement Hub outage worker outage rollback or prior-image recovery hides invalidates or releases an already promised native coupon"
  - id: accepted_work_stranded
    rule: "disablement rollback or prior-image recovery hides deletes or strands accepted events snapshots commands leases reservations coupons or required reconciliation"
  - id: reconciliation_gap
    rule: "ledger lot reservation coupon connector queue presentation or customer aggregate differs from immutable commerce and value evidence"
  - id: sensitive_evidence
    rule: "contact identity raw payload coupon plaintext reusable signing material private selector or ledger metadata enters public output logs support output or evidence"
  - id: unsafe_rollout
    rule: "migration presentation or panel is enabled outside the approved pilot before recovery baseline disabled deployment and non-canary isolation pass"
  - id: score_or_approval_bypass
    rule: "module status completion approval artifact score total or category floor is changed without exact synchronized evidence"
  - id: unexplained_or_unapproved_close
    rule: "any accessibility privacy tenancy snapshot value coupon checkout queue approval artifact score floor or critical finding remains unresolved"
