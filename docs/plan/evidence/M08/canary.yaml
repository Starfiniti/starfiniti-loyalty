automaticFails:
  - id: consent_bypass
    rule: "a withdrawn missing superseded or purpose-mismatched consent still authorizes a notification provider action"
  - id: suppression_bypass
    rule: "provider system privacy-erasure or trusted suppression is cleared weakened or bypassed by customer merchant worker or retry state"
  - id: duplicate_delivery
    rule: "duplicate replay delayed delivery lease recovery or concurrent processing creates another provider submission or customer message"
  - id: provider_authority
    rule: "SMTP Klaviyo webhook or provider response becomes authoritative for tenant consent identity value template or delivery history"
  - id: tenant_connection_mismatch
    rule: "a tenant provider connection key fingerprint endpoint template customer event or delivery authority is mismatched or browser-selected"
  - id: deployment_mode_violation
    rule: "self-hosted invokes managed Klaviyo or remote entitlement while managed or disabled state starts an unapproved provider path"
  - id: webhook_destination_escape
    rule: "a redirect DNS rebinding private reserved mixed answer unpinned socket or unbounded response reaches an internal or unapproved destination"
  - id: webhook_replay_or_signature_failure
    rule: "webhook retries change delivery identity exact bytes timestamp or signature or a receiver replay is accepted as a new effect"
  - id: ambiguous_delivery_retry
    rule: "an ambiguous SMTP Klaviyo subscribe or webhook acceptance is automatically retried instead of entering bounded manual review"
  - id: unbounded_retry_or_queue
    rule: "provider work retries exceeds its hard ceiling loses its lease boundary or remains indefinitely accepted without visible terminal or review state"
  - id: provider_outage_value_impact
    rule: "an SMTP Klaviyo webhook DNS or receiver outage delays rejects rewrites or reverses loyalty value consent history refunds or reconciliation"
  - id: checkout_dependency
    rule: "WooCommerce checkout synchronously depends on notification events contacts templates workers providers consent or delivery outcomes"
  - id: accepted_work_stranded
    rule: "disablement rollback suppression or prior-image recovery hides or deletes accepted event delivery attempt template consent or review evidence"
  - id: sensitive_evidence
    rule: "reusable provider or signing material contact data coupon plaintext raw payload rendered content provider body or private ledger metadata enters logs support output or evidence"
  - id: cross_tenant_exposure
    rule: "an unrelated tenant contact event preference suppression template connection endpoint delivery attempt health issue or provider result becomes visible or mutable"
  - id: unexplained_or_unapproved_close
    rule: "any consent event template provider delivery queue tenancy privacy value checkout approval artifact score floor or critical finding remains unresolved"
