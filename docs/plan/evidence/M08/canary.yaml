    evidence: "Exact event retries, lease expiry, worker restart, and concurrent claims must converge on one provider-neutral event and at most one accepted submission."
  - id: schedule_timezone_canary
    status: pending
    evidence: "Scheduled and expiry notifications must use exact instants and configured timezone behavior across normal and daylight-saving boundaries."
  - id: retry_dead_letter_canary
    status: pending
