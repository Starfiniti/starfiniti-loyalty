  - id: webhook_rotation_canary
    status: pending
    evidence: "A bounded current and previous signing-key window must validate both approved signatures then retire the previous fingerprint without replay."
  - id: webhook_replay_canary
    status: pending
    evidence: "Replaying the stable webhook delivery must be claimed once by the receiver and create no second downstream effect."
  - id: webhook_destination_policy_canary
    status: pending
    evidence: "Production must reject redirects and private, reserved, mixed, or changed DNS answers while using the approved public pinned destination."
  - id: consent_withdrawal_canary
