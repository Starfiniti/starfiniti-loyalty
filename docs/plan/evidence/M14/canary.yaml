automaticFails:
  - card payment contact redirect provider response or raw webhook material is stored logged exported or copied into evidence
  - self-hosted mode reads a Stripe key scans billable sources constructs a provider client or makes a Stripe request
  - browser input Auth claims or provider metadata grant tenant customer Price meter return subscription entitlement or commercial authority
  - unsigned stale oversized malformed or changed replay input enters the verified provider inbox
  - duplicate delayed changed or out-of-order provider delivery creates a second effect or regresses current commercial state
  - provider state or navigation return overrides committed event-time PostgreSQL evidence
  - duplicate source or dispatch creates another billable unit or a correction loses source period account or meter attribution
  - asynchronous provider usage or invoice evidence is declared reconciled before bounded convergence polling succeeds
  - delinquency contract or billing outage blocks checkout ingestion refunds releases redemption reconciliation export account access or promised value
  - a manual contract is self-approved unbounded unaudited backdated over conflicting evidence or effective outside its exact interval
  - cross-tenant account plan operation event usage policy contract summary or provider evidence is visible or mutable
  - reusable Stripe keys signatures or raw provider resource identifiers appear in repository browser database logs support output or canary evidence
  - ambiguous provider outcome is retried as success released for changed reuse or discarded without reconciliation
  - approved release sandbox catalogue policy recovery point canary rollback observation or final reconciliation evidence is absent
  - module score or any category floor is missed or a critical security tenancy privacy billing ledger recovery accessibility data-loss or immutable-history finding remains
