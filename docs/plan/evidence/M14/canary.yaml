automaticFails:
  - id: sensitive_provider_data
    rule: "card payment contact redirect provider response raw webhook or reusable authority material is stored logged exported shown in support output or copied into evidence"
  - id: self_hosted_provider_call
    rule: "self-hosted mode reads a Stripe key scans billable sources constructs a provider client starts a billing worker or makes a Stripe request"
  - id: browser_or_provider_authority
    rule: "browser input Auth claims provider metadata navigation return or mutable response grants tenant customer Price meter subscription entitlement or commercial authority"
  - id: unverified_webhook
    rule: "unsigned stale oversized malformed unsupported or changed replay input enters the verified provider inbox or changes commercial state"
  - id: provider_replay_regression
    rule: "duplicate delayed changed or out-of-order provider delivery creates another receipt effect entitlement revision or regresses event-time commercial state"
  - id: duplicate_usage_effect
    rule: "duplicate source retry concurrency correction or dispatch creates another billable unit loses source period account or meter attribution or makes usage negative"
  - id: premature_reconciliation
    rule: "asynchronous provider usage invoice subscription or ambiguity evidence is declared reconciled before bounded convergence polling and exact local comparison succeed"
  - id: protected_path_block
    rule: "delinquency contract provider outage billing worker failure or commercial restriction blocks checkout ingestion refunds releases redemption reconciliation export account access or promised value"
  - id: manual_contract_bypass
    rule: "a manual contract is self-approved unbounded unaudited backdated over conflicting evidence mutable in place or effective outside its exact interval"
  - id: cross_tenant_exposure
    rule: "an unrelated organization account plan operation event usage policy contract summary provider or protected-path selector becomes visible mutable or externally actionable"
  - id: credential_or_resource_leak
    rule: "reusable Stripe keys signatures raw provider resource identifiers payment values or secret mounts appear in repository browser database logs support output or canary artifacts"
  - id: ambiguous_outcome_guess
    rule: "an ambiguous provider outcome is retried as success released for changed reuse discarded or used as entitlement authority without exact reconciliation"
  - id: unsafe_rollout
    rule: "managed billing Price meter policy contract Checkout Portal webhook or usage dispatch is enabled outside the approved tenant before recovery baseline disabled deployment and isolation pass"
  - id: reconciliation_gap
    rule: "subscription entitlement Price meter usage invoice policy contract attempt protected-path checkout or ledger evidence differs from immutable source facts"
  - id: score_or_approval_bypass
    rule: "module status completion approval catalogue policy artifact score total or category floor is changed without exact synchronized evidence"
  - id: unexplained_or_unapproved_close
    rule: "any billing lifecycle usage invoice protected-path privacy approval artifact score floor or critical security tenancy ledger recovery accessibility data-loss finding remains unresolved"
