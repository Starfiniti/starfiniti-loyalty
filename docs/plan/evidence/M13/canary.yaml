    status: pending
    evidence: An approved enterprise OIDC and SAML test tenant with a controlled SCIM cohort has not been supplied.
  - id: canary_approval
    status: pending
    evidence: No production owner has approved the identity, agency/support, recovery, offboarding, or disposable deletion canary window.
  - id: pre_change_recovery_point
    status: pending
    evidence: A fresh verified PostgreSQL base, WAL position, encrypted incremental archive, and application configuration recovery point must precede deployment.
  - id: production_source_baseline
    status: pending
    evidence: Public and VM health are current, but minimized organization, membership, source, endpoint, relationship, grant, audit, and zero-ledger counts require the approved window.
  - id: administration_secret_mounts
    status: pending
    evidence: Reviewed Authentik and Supabase administration material must be mounted owner-only in the isolated dashboard boundary and excluded from browser, worker, database, and logs.
  - id: authentik_egress_policy
    status: pending
    evidence: Production Authentik must reach only exact approved private dependencies while every other private, reserved, link-local, and metadata destination is denied.
  - id: dns_rebinding_denial
    status: pending
    evidence: A controlled public-to-private DNS change must fail at socket-pinned validation and again immediately before enablement without recording a successful source state.
  - id: disabled_deployment
    status: pending
    evidence: Candidate images and M13 migrations have not been deployed; tenant federation, SCIM, agency support, and recovery operations remain absent or disabled in production.
  - id: migration_registration
    status: pending
    evidence: Production must record each M13 additive migration version and source hash exactly once before any enterprise identity command.
  - id: non_canary_disabled
    status: pending
    evidence: "Unrelated organizations, users, sessions, identity sources, SCIM endpoints, agency relationships, support grants, recovery cases, and deletion cases must receive no M13 capability."
  - id: identity_entitlement_canary
    status: pending
    evidence: Keep enterprise identity disabled globally, then enable only the approved Starfiniti test organization after disabled-deployment smoke passes.
  - id: local_owner_recovery
    status: pending
    evidence: Prove one retained local owner can sign in, review state, disable federation, and recover while every upstream provider is unavailable.
  - id: oidc_tenant_canary
    status: pending
    evidence: Validate, create, enable, link, log in, disable, rotate, and retire one approved organization OIDC source with exact issuer, subject, and immutable revision reconciliation.
  - id: saml_tenant_canary
    status: pending
    evidence: Validate, create, enable, log in, disable, rotate, and retire one approved organization SAML source with signed response, audience, entity, and certificate evidence.
  - id: scim_discovery_contract
    status: pending
    evidence: Run the approved client against ServiceProviderConfig, ResourceTypes, Schemas, filtering, pagination, media type, and conditional request behavior.
  - id: scim_provisioning_canary
    status: pending
    evidence: Provision a controlled cohort through Users and Groups, reconcile opaque external resources, and prove exact Authentik hashed-subject correlation before access exists.
  - id: group_role_allowlist
    status: pending
    evidence: Map one opaque approved Group to one non-owner role, leave an unmapped Group authority-free, and reject owner or conflicting role mappings.
  - id: mapped_unmapped_login
    status: pending
    evidence: A correlated provisioned and mapped user gains only the approved live membership while unprovisioned, unmapped, and conflicting-role users remain denied.
  - id: immediate_deprovisioning
    status: pending
    evidence: SCIM active-false, role removal, DELETE, and endpoint revocation each remove live membership on the same committed request with retained audit.
  - id: stale_session_denial
    status: pending
    evidence: After membership, endpoint, grant, recovery, or Auth-session revocation, the next request from an older signed access token fails closed.
  - id: endpoint_rotation_revocation
    status: pending
    evidence: Rotate the one-time SCIM credential, prove only a digest persists, reject the prior bearer immediately, then revoke and deny the current bearer.
  - id: forged_claim_denial
    status: pending
    evidence: Forged email, domain, role, organization, IdP group, issuer, metadata, and JWT profile fields grant no membership, relationship, support, or recovery authority.
  - id: cross_tenant_denial
    status: pending
    evidence: Substitute every public organization, source, endpoint, relationship, grant, and deletion selector from an unrelated subject and receive no data or effect.
  - id: provider_outage_recovery
    status: pending
    evidence: Authentik, IdP, SCIM client, and dashboard outages fail independently; accepted sessions and local owner recovery follow the reviewed state without guessing external success.
  - id: agency_bilateral_canary
    status: pending
    evidence: A consenting client owner issues one capability and a separate agency owner accepts it, producing one minimized relationship and zero membership or ledger effect.
  - id: agency_revocation
    status: pending
    evidence: Revoke the disposable relationship from both perspectives in sequence and prove dependent requests and grants fail immediately while history remains visible.
  - id: support_approval_separation
    status: pending
    evidence: An agency operator requests exact scopes and a separate client owner narrows and approves them; requester self-approval and changed retries fail.
  - id: support_scope_use_audit
    status: pending
    evidence: Use each approved read scope once, reconcile only its minimized fields, and confirm exactly one tenant-visible immutable use event per projection.
  - id: support_revocation_stale_session
    status: pending
    evidence: Grant revocation, relationship revocation, agency membership revocation, expiry, and Auth-session termination each deny the next support read.
  - id: aal2_break_glass
    status: pending
    evidence: A retained owner opens one 30-minute recovery session only after fresh AAL2, records every use, and fails immediately after Auth-session termination.
  - id: administration_export_reconciliation
    status: pending
    evidence: Export the bounded administration manifest and reconcile every resource, credential-state, immutable-evidence, ledger count, and exact net-zero field without PII.
  - id: offboarding_credential_inventory
    status: pending
    evidence: Offboard a disposable organization and prove zero live membership except recovery owner, zero active credential path, webhook tombstones, and unchanged immutable value evidence.
  - id: deletion_cooling_cancel
    status: pending
    evidence: Request deletion, prove completion fails before seven days, cancel once without restoring authority, then create a fresh exact case for the approved rehearsal.
  - id: deletion_pseudonymization
    status: pending
    evidence: Complete only the disposable cooled case, reconcile organization and directory pseudonyms, zero memberships, retained tombstone, and unchanged immutable ledger and audit rows.
  - id: production_outage_continuity
    status: pending
    evidence: Stop federation, SCIM, agency/support, and recovery application paths independently while checkout, ingestion, refunds, releases, redemption, export, and reconciliation continue.
  - id: rollback_rehearsal
    status: pending
    evidence: Disable sources and entitlement, revoke endpoints, grants, and relationships, restore prior images, retain local owner and immutable evidence, then reconcile access and value.
  - id: observation_window
    status: pending
    evidence: Observe the controlled identity and administration canaries after rollback rehearsal and record errors, retries, latency, load, audit, privacy, and access health.
  - id: final_reconciliation
    status: pending
    evidence: Confirm zero unexplained membership, role, session, source, endpoint, relationship, grant, use, credential, pseudonym, audit, ledger, checkout, or privacy difference.
