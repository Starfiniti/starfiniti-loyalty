automaticFails:
  - id: upstream_claim_authority
    rule: "email domain group name profile metadata browser input upstream claim issuer label or provider attribute grants tenant membership role support recovery or deletion authority"
  - id: unprovisioned_access
    rule: "an uninvited unprovisioned unmapped conflicting revoked or unrelated identity gains membership relationship support recovery export or administration access"
  - id: stale_session_access
    rule: "a stale Auth or application session retains access after membership endpoint grant relationship recovery agency or organization revocation"
  - id: credential_or_identity_leak
    rule: "reusable plaintext federation SCIM agency support recovery administration or identity material persists outside its approved isolated handoff or enters logs evidence browser or database"
  - id: cross_tenant_exposure
    rule: "an unrelated organization source endpoint directory membership relationship grant export deletion audit identity or value selector becomes visible mutable or externally actionable"
  - id: egress_or_rebinding_escape
    rule: "redirect DNS rebinding private reserved link-local metadata mixed answer unpinned socket or changed validation reaches an internal or unapproved destination"
  - id: duplicate_identity_effect
    rule: "retry concurrency replay rotation lease recovery or provider ambiguity creates another membership source endpoint mapping relationship grant use case deletion or audit effect"
  - id: agency_authority_escalation
    rule: "an agency relationship creates organization membership customer sharing wallet sharing owner role write authority or product command authority"
  - id: support_approval_bypass
    rule: "support is self-approved over-scoped writable hidden unaudited expired changed on retry or usable after grant relationship membership endpoint or session revocation"
  - id: break_glass_bypass
    rule: "break-glass works without a live owner signed fresh AAL2 correlated Auth session exact short expiry tenant-visible use evidence and immediate revocation checks"
  - id: offboarding_residue
    rule: "offboarding leaves an active credential session destination signing fingerprint schedule export payload relationship support grant or non-recovery membership"
  - id: premature_or_destructive_deletion
    rule: "deletion completes before cooling without exact approval or rewrites removes or loses ledger programme event provisioning value tombstone or immutable audit history"
  - id: identity_value_dependency
    rule: "checkout ingestion refunds releases reconciliation export existing redemption promised value or customer access depends on federation SCIM agency support recovery or deletion availability"
  - id: unsafe_rollout
    rule: "identity federation SCIM agency support recovery offboarding or deletion is enabled outside the approved fixture before recovery baseline disabled deployment egress and isolation pass"
  - id: reconciliation_gap
    rule: "membership role session source endpoint relationship grant use credential pseudonym audit ledger checkout privacy or identity evidence differs from immutable source facts"
  - id: score_or_approval_bypass
    rule: "module status completion approval fixture policy artifact score total or category floor is changed without exact synchronized evidence"
  - id: unexplained_or_unapproved_close
    rule: "any identity access tenancy federation SCIM agency support recovery offboarding deletion privacy approval artifact score floor or critical finding remains unresolved"
