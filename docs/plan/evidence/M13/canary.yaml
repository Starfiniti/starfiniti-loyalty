automaticFails:
  - email domain group name profile metadata browser input or upstream claim grants tenant authority
  - uninvited unprovisioned unmapped conflicting or unrelated identity gains membership
  - stale Auth or application session retains access after membership endpoint grant relationship or recovery revocation
  - reusable plaintext federation SCIM agency support recovery or administration material persists outside its approved isolated handoff
  - cross-organization source endpoint directory membership relationship grant export deletion audit or value access
  - agency relationship creates membership customer sharing wallet sharing or product-command authority
  - support is self-approved over-scoped writable hidden unaudited expired or usable after revocation
  - break-glass works without a live owner signed AAL2 correlated Auth session short expiry and tenant-visible use evidence
  - offboarding leaves an active credential session destination signing fingerprint schedule export payload or non-owner membership
  - deletion completes before cooling without exact approval or rewrites ledger programme event provisioning or immutable audit history
  - checkout ingestion refunds releases reconciliation export existing redemption or customer value depends on enterprise identity availability
  - unexplained membership role source endpoint relationship grant use credential pseudonym audit ledger checkout or privacy difference
  - approved release recovery point enterprise identity fixture canary rollback observation or final reconciliation evidence is absent
  - critical security tenancy authorization privacy recovery accessibility data-loss or immutable-history finding remains unresolved
