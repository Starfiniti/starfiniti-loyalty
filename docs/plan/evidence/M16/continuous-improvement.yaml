automaticFails:
  - a due monthly review or quarterly exercise is missing stale incomplete or represented as a healthy zero
  - a Critical backlog item is overdue or a High item exceeds its bounded remediation window without approved risk evidence
  - a recurring failure reaches two occurrences without at least one linked durable regression control
  - a material change ships without rescoring every affected module against the current evidence
  - an experiment is promoted without improving its declared primary metric or while any guardrail fails
  - a provider or dependency change is accepted without official-source review impact classification and an owner
  - a quarterly restore tenancy privacy SCIM or incident exercise has an unexplained failure or protected-value difference
  - an obsolete decision is silently rewritten instead of being superseded through an ADR
  - completion is claimed below 90 total below a category floor or without distinct digest-bound artifacts and all approvals
