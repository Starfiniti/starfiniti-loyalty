schema: starfiniti.openssh-client-security-evidence.v1
status: in_progress
candidate:
  branch: codex/enterprise-roadmap-integration
  commit: null
plan:
  path: infrastructure/testing/openssh-client-security/plan.yaml
  sha256: c355e4100c45f9350b8a8c4114d1d1bbb9d29aeb318aa7cd02b7b04b1143a6b2
canary: null
checks:
  - id: threat_model
    status: passed
    evidence: The privileged host client is exposed to a guest or remote endpoint as server; CVE-2026-60002 is therefore relevant, while the 10.5 agent, multiplexed remote-forward, and tunnel-restrict fixes are recorded without claiming that disabled features are active.
  - id: signed_source
    status: passed
    evidence: The plan binds the official 10.5p1 portable archive, release-note SHA-256, detached signature, release-key bytes, official full fingerprint, and a safe 930-entry source-tree manifest.
  - id: client_only_build
    status: passed
    evidence: The candidate builds only the ssh target into a versioned side-by-side root; it does not build, install, configure, select, or start a candidate sshd or replace any distribution path.
  - id: rollback_package
    status: passed
    evidence: Debian openssh-client 1:10.0p1-7+deb13u4 remains installed and is resolved through signed metadata plus an independently hashed exact archive URL before the synthetic client proof.
  - id: compatibility_canary
    status: pending
    evidence: The bootstrap Linux run has not yet discovered and locked the stripped candidate executable digest, so no exact-plan current/candidate compatibility artifact is claimed.
  - id: operations_escrow
    status: pending
    evidence: Operations has not escrowed the exact source, signature, release key, build inputs, candidate binary, rollback package, digest inventory, and verification instructions.
  - id: real_provider
    status: pending
    evidence: The candidate has not connected to every approved real recovery endpoint with the exact known-host, key, forced-command, rsync, Borg, retry, timeout, and monitoring behavior.
  - id: production_rollout
    status: pending
    evidence: No consumer inventory has been switched to the versioned path and no maintenance window, timer cycle, observation, or rollback exercise has occurred.
  - id: isolated_restore
    status: pending
    evidence: No recovery transfer performed through the candidate client has completed the isolated database, Auth, application, configuration, and connector-secret recovery gate.
  - id: independent_review
    status: pending
    evidence: Operations, security, recovery, and an independent reviewer have not approved the exact candidate, production activation, or rollback evidence.
productionMutation: false
automaticFails:
  - source archive signature release key fingerprint checksum size source-tree manifest candidate binary or rollback package differs from the reviewed plan
  - any candidate build installs or replaces sshd distribution ssh paths host configuration known-host data recovery keys or production consumer configuration
  - any canary has a production route or credential host networking published port unbounded output retained container network volume or image or writable client root
  - any production consumer selects a noncanonical executable or unreviewed digest or enables agent X11 local remote tunnel proxy multiplexing interactive or password behavior
  - production changes before escrow real-provider compatibility isolated restore monitoring rollback independent review and explicit approval are complete
