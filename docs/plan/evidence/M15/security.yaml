automaticFails:
  - Any Critical or High automated scan result remains unresolved or is hidden by a broad ignore rule, path exclusion, or severity reduction.
  - CodeQL analysis does not cover the exact JavaScript and TypeScript candidate or runs with broader authority than the reviewed workflow.
  - A repository secret or reusable credential appears in source history workflow output a scanner report an SBOM or committed evidence.
  - Either deployable image is not identified by the exact candidate digest or is scanned with stale incomplete or selectively disabled scanners.
  - The worker image contains a root-workspace dependency tree or cannot import every declared external package from its exact built runtime.
  - A prohibited or restricted production-image licence finding is suppressed without an exact package legal decision and independent review.
  - An SBOM is missing malformed generated from a different image or cannot be reconciled to the released image and candidate commit.
  - Release files or container images lack verifiable repository-scoped provenance for their exact checksum or registry digest.
  - The reciprocal source plan omits a distributed component or exact build input, an archive exceeds its bounds or differs from its manifest, or registry authentication occurs before independent source verification.
  - The dynamic scanner can route outside its internal disposable Docker network or can reach any public staging or production origin.
  - The deployable dashboard omits CSP framing or MIME controls permits unsafe-inline script or relies on an unverified reverse proxy to add them.
  - The dynamic scan receives authentication secrets customer data provider credentials production configuration or a mutable value-bearing database.
  - The disposable target publishes a host port uses host networking omits cleanup or survives a failed or cancelled security workflow.
  - ZAP does not complete bounded spider passive active report and exit jobs or reports any unresolved High alert.
  - Scanner advisory databases exceed the approved freshness bound or their versions and update timestamps are absent from evidence.
  - Production review uses active mutation without explicit approval or omits edge proxy headers TLS cookies egress and secret-mount controls.
  - The independent penetration test omits tenant isolation authorization ledger connector SSO SCIM billing or infrastructure scope without owner acceptance.
  - Any independent Critical or High finding lacks a completed remediation and tester-performed retest on the exact corrected release candidate.
  - A Medium or false-positive decision lacks reproducible technical evidence named ownership expiry and a regression or remediation link.
  - A tagged dashboard or worker image is distributed while R-056 corresponding-source or third-party-notice evidence is open or unverified.
  - The development-only R-032 High advisory remains installed unresolved or silently excluded when the module is marked complete.
  - Security completion is claimed while any mandatory check artifact digest task state or named security-owner approval is missing or inconsistent.
