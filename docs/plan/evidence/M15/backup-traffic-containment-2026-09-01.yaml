  interpretation: The multi-terabyte VM and bridge counters are cumulative from the contained 2026-08-14 VM-to-host full-stream incident. Host RRD stayed below 279067 outbound bytes per second during the observed incident window and Borg added only kilobytes of deduplicated data per repeated multi-gigabyte input, so the amplified stream did not leave the server. The later physical eno1 total includes subsequent whole-host backups and is not causal evidence for the incident. No current full-stream transfer was observed.
rootCause:
  historicalAmplification: The retired content-from-command exporter represented the complete recovery set as one changing stdin object and retransmitted it before Borg deduplication on every cycle.
  currentArchivePath: The active PostgreSQL job uses restricted incremental rsync staging and then Borg creation.
  recurringRecoveryConflict: The enabled whole-host controller was configured for raw disk mode and shared the PostgreSQL local and remote Borg serialization boundary. Its 2026-08-31 run caused a 1h34m36s PostgreSQL off-site gap, and its 2026-09-01 scheduled run failed because a PostgreSQL cycle already held the shared lock.
