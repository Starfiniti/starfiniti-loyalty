checks:
  - id: plan_contract
    status: passed
    evidence: The exact two-endpoint plan binds OS image digests, authorities, suites, rsync and required dependency versions and hashes, and the minimum protocol baseline.
  - id: source_authority_contract
    status: passed
    evidence: Debian archive metadata and the rsync project Launchpad PPA are independently scoped, with signed APT metadata and the exact PPA signing fingerprint.
  - id: build_verification_contract
    status: passed
    evidence: The disposable build rejects the wrong OS, architecture, authority, signature, checksum, package metadata, version, executable ownership, wrapper, or confinement integration before execution.
  - id: rollback_artifact_contract
    status: passed
    evidence: Exact host rsync, host libacl1, and guest rsync rollback versions, signed APT authorities, HTTPS archive URLs, package metadata, architectures, and SHA-256 digests are fail-closed inputs to the disposable build.
  - id: workflow_contract
    status: passed
    evidence: Security CI executes the canonical plan on an internal Docker network and uploads only the minimized report; no port, SSH route, production target, package binary, or payload is published.
  - id: exact_head_canary
    status: pending
    evidence: The changed rollback verification path has not yet passed Linux Security CI on its exact implementation head, so it binds no workflow run, job, artifact, or report.
  - id: rollback_escrow
    status: pending
    evidence: Operations has not copied the three exact verified package bytes to approved offline escrow or independently rechecked their recorded SHA-256 digests, so production installation remains prohibited.
  - id: production_rollout
    status: pending
    evidence: No maintenance window, dual-endpoint installation, forced-command test, manual archive, or timer archive has been approved or performed.
  - id: isolated_restore
    status: pending
    evidence: No archive produced through the candidate transport has completed the independent isolated full-service recovery gate.
productionMutation: false
automaticFails:
