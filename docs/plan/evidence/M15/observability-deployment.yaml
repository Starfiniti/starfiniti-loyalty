checks:
  - id: official_provenance
    status: passed
    evidence: The plan binds current official releases to exact tag objects or commits, Linux amd64 artifacts, registries, and licences reviewed on 2026-08-31.
  - id: image_digest_binding
    status: passed
    evidence: All five central services use exact multi-architecture image index digests and separately record the reviewed Linux amd64 manifest digest.
  - id: compose_isolation
    status: passed
    evidence: The candidate enforces read-only roots, dropped capabilities, no-new-privileges, resource bounds, loopback administration, unpublished exporters, and isolated control traffic.
  - id: operator_secret_separation
    status: passed
    evidence: Receiver configuration, Grafana administrator password, PostgreSQL exporter modules, and discovery targets are required explicit operator-owned mounts with safe empty defaults in Git.
  - id: prometheus_discovery_minimization
    status: passed
    evidence: File discovery uses bounded service classes, rewrites retained instances, drops authentication selectors, and keeps only the exact operational metric and label allowlists.
  - id: component_configuration
    status: passed
    evidence: Prometheus, Alertmanager, blackbox, and PostgreSQL exporter configurations are source controlled and fail safe without a live receiver, database module, or target.
  - id: grafana_locked_provisioning
    status: passed
    evidence: Grafana provisions the locked operations dashboard and Prometheus 3.14.0 source while disabling anonymous access, sign-up, analytics, updates, and plugin administration.
  - id: native_textfile_exporter
    status: passed
    evidence: The exact node exporter archive and hardened non-root systemd unit enable only the textfile collector and grant no host, process, network, Docker, or database inspection authority.
  - id: validator_selftest
    status: passed
    evidence: Deterministic validation rejects mutable images, public ports, privilege, egress drift, embedded targets or credentials, unsafe probes, false authority, and digest mismatch.
  - id: exact_head_linux_canary
    status: pending
    evidence: A clean exact-head GitHub Linux amd64 run must prove exact versions, promtool and amtool checks, runtime hardening, loopback ports, unpublished exporters, and zero residue.
  - id: approved_monitoring_environment
    status: pending
    evidence: A dedicated monitoring host, storage, retention, access, time synchronization, backup, rollback ownership, and bounded activation window require explicit approval.
  - id: live_target_inventory
    status: pending
    evidence: Minimized application, worker, PostgreSQL, edge, and host target files must bind approved production sources without retaining raw target or tenant identity.
  - id: receiver_binding
    status: pending
    evidence: Environment-owned Alertmanager routes must bind each protected route class to approved primary and secondary destinations without credentials or identities entering Git.
  - id: dead_man_delivery
    status: pending
    evidence: An independently hosted and controlled dead-man route must prove it pages when Prometheus, Alertmanager, the monitoring host, or the monitoring network disappears.
  - id: production_activation
    status: pending
    evidence: Production services, node exporter installation, target scraping, and receiver routing remain unauthorized until all prerequisites and an explicit owner activation approval pass.
  - id: observation_and_reconciliation
    status: pending
    evidence: At least one complete operational and backup cycle must reconcile targets, alerts, routes, backup evidence, checkout independence, privacy, and value invariants with zero unexplained difference.
