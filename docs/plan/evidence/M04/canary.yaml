automaticFails:
  - id: unsupported_reward
    rule: an authorable reward has no executable native or audited manual fulfilment state machine
  - id: unsupported_stored_value
    rule: store credit gift card cash redemption cash-like value or maximum-capped percentage reward becomes publishable
  - id: duplicate_business_effect
    rule: duplicate replay delayed delivery or concurrent processing creates another native or manual business effect
  - id: capacity_oversubscription
    rule: global quantity points budget wallet funds or per-member capacity oversubscribes or partially allocates
  - id: member_limit_bypass
    rule: a per-customer limit can be bypassed by replay concurrency identity alias or connector ordering
  - id: ambiguous_native_outcome
    rule: an ambiguous native outcome releases captures reissues or reuses points or capacity before reconciliation
  - id: duplicate_compensation
    rule: definitive rejection cancellation or expiry loses original reservation attribution or compensates more than once
  - id: untrusted_authority
    rule: browser input Auth claims email domain or connector metadata grants tenant customer wallet reward or value authority
  - id: cross_tenant_exposure
    rule: unrelated tenant programme customer reward reservation case operation connector or evidence becomes visible or mutable
  - id: checkout_dependency
    rule: WooCommerce checkout synchronously depends on the Hub worker entitlement provider or reward command outcome
  - id: accepted_work_stranded
    rule: disabling expanded rewards hides or strands an accepted native reservation or manual fulfilment case
  - id: sensitive_evidence
    rule: reusable signing material coupon plaintext raw payload personal data or private ledger metadata enters logs support output or evidence
  - id: unexplained_reconciliation
    rule: any ledger balance lot reservation capacity command coupon case queue checkout tenancy or privacy reconciliation has an unexplained difference
  - id: canary_scope_breach
    rule: production enables expanded rewards outside the exact approved pilot scope value ceiling or observation window
  - id: missing_production_evidence
    rule: approved release pilot store recovery point canary rollback observation or final reconciliation evidence is absent
  - id: score_or_critical_finding
    rule: module score or any category floor is missed or a critical security tenancy privacy ledger recovery accessibility data-loss or immutable-history finding remains
