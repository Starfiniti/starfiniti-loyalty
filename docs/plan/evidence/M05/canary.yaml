  - id: migration_registration
    status: pending
    evidence: "Production must record every candidate migration version and source digest exactly once before advanced VIP can be enabled."
  - id: non_canary_disabled
    status: pending
    evidence: "Unrelated organizations, workspaces, programmes, customers, connectors, and sessions must receive no advanced VIP capability."
  - id: production_shadow_parity
    status: pending
    evidence: "Production shadow evaluation must compare V1 and V2 Rose Bloom and Icon results from the same immutable facts with zero unexplained difference before publication."
  - id: lifetime_qualification_canary
    status: pending
    evidence: "One approved member must qualify by exact lifetime facts and retain the same explanation, progress, history, and effective tier across retry."
  - id: rolling_qualification_canary
    status: pending
    evidence: "Rolling-window entry, retention, review, grace, downgrade, and re-entry must use the original event instant and exact cutoff boundaries."
  - id: calendar_qualification_canary
    status: pending
    evidence: "Calendar-year qualification must use the configured IANA timezone and pass year-boundary and daylight-saving evidence without execution-time drift."
  - id: threshold_group_canary
    status: pending
    evidence: "Spend, points, order, referral, and verified-action metrics with AND and OR groups must match simulator, persisted policy, immutable facts, and live decisions."
  - id: upgrade_grace_downgrade
    status: pending
    evidence: "Approved facts must exercise upgrade, retention, grace, downgrade, and re-entry once with append-only decision and membership history."
  - id: refund_backdated_canary
    status: pending
    evidence: "One refund and one delayed canonical fact must compensate original evidence, preserve ordering, and converge to the deterministic tier without duplicate movement."
  - id: manual_override_canary
    status: pending
    evidence: "An authorized owner or admin must create, inspect, expire, and revoke a reason-bound override while the independently calculated automatic tier remains visible."
  - id: multiplier_benefit_canary
    status: pending
    evidence: "A tier earning multiplier must equal the displayed published rate and create one exactly attributable award without browser or worker-selected authority."
  - id: reward_access_benefit
    status: pending
    evidence: "Tier-gated reward discovery and claim authorization must allow the eligible member, deny the ineligible member, and preserve the normal reservation and ledger boundary."
  - id: free_shipping_benefit
    status: pending
    evidence: "A configured tier free-shipping benefit must execute through the reviewed native WooCommerce path without synchronous Hub checkout dependency."
  - id: early_access_custom_perk
    status: pending
    evidence: "Early-access and custom-perk states must expose exact eligibility and an executable or audited manual fulfilment path without inventing value."
  - id: expiry_preview_canary
    status: pending
    evidence: "Merchant expiry preview must reconcile outstanding, overdue, reserved-past-expiry, affected-member, next-date, 30-day, and 90-day aggregates exactly."
  - id: expiry_reminder_canary
    status: pending
    evidence: "Nearest-relevant reminder scheduling must honor the published schedule and current consent, suppression, retry, and deduplication state exactly once."
  - id: expiry_sweep_canary
    status: pending
    evidence: "The bounded expiry sweep must expire each eligible lot once, preserve original attribution, skip reserved value, and reconcile wallet and liability effects."
  - id: refund_expiry_restoration
    status: pending
    evidence: "Refund restoration after expiry must use the original lot policy and attribution without silently extending, duplicating, or losing customer value."
  - id: customer_progress_canary
    status: pending
    evidence: "The approved member must see available points separately from qualifying progress, next and retention milestones, review timing, grace, override, expiry, and history."
  - id: merchant_performance_canary
    status: pending
    evidence: "Tenant-scoped aggregate tier population, movement, progress, and liability views must reconcile to immutable facts and reveal no member identity."
  - id: cross_tenant_denial
    status: pending
    evidence: "Unrelated organization, programme, customer, wallet, policy, fact, decision, membership, override, lot, reminder, and benefit selectors must reveal nothing and create no effect."
  - id: membership_history_reconciliation
    status: pending
    evidence: "Every automatic and manual effective-tier change must reconcile to immutable facts, decisions, current membership, overrides, grace, and original event time."
  - id: award_multiplier_reconciliation
    status: pending
    evidence: "Every canary award must reconcile published base rate, effective tier multiplier, original commerce or activity fact, ledger transaction, lots, and balance exactly."
  - id: expiry_liability_reconciliation
    status: pending
    evidence: "Every expiry and restoration must reconcile policy version, earned date, lots, reservations, ledger entries, wallet balance, forecasts, and liability aggregates."
  - id: notification_reconciliation
    status: pending
    evidence: "Every scheduled, suppressed, accepted, retried, and deduplicated expiry notice must reconcile to the exact policy threshold and provider-neutral event."
  - id: disable_state_continuity
    status: pending
    evidence: "Disabling advanced VIP must stop new V2 transitions while retaining accepted benefits, effective membership, history, overrides, expiry evidence, and customer access."
  - id: rollback_rehearsal
    status: pending
    evidence: "Disable the pilot capability, drain or hold accepted work, restore prior images, and retain additive policy, fact, decision, membership, override, lot, and audit history."
  - id: observation_window
    status: pending
    evidence: "Observe the bounded canary after rollback rehearsal and record decision latency, retries, late facts, expiry lag, reminders, checkout, privacy, and reconciliation health."
  - id: final_reconciliation
    status: pending
    evidence: "Confirm zero unexplained policy, tier, fact, decision, membership, override, award, lot, expiry, reminder, benefit, checkout, tenancy, or privacy difference."
