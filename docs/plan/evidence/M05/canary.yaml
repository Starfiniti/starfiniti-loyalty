automaticFails:
  - id: historical_tier_rewrite
    rule: "a published tier policy or historical qualification decision is rewritten or reinterpreted"
  - id: shadow_parity_drift
    rule: "a migrated Rose Bloom or Icon case differs between immutable V1 and V2 evaluation"
  - id: timezone_boundary_drift
    rule: "calendar or rolling qualification changes because worker execution time replaces the original event instant"
  - id: backdated_nondeterminism
    rule: "a delayed or backdated fact produces an ordering-dependent tier decision or unexplained history"
  - id: refund_downgrade_failure
    rule: "a refund fails to compensate its original qualification fact or apply the configured retention grace"
  - id: duplicate_tier_decision
    rule: "duplicate replay delayed delivery or concurrent processing creates another tier movement benefit or expiry effect"
  - id: override_authority_bypass
    rule: "a manual override lacks live owner or admin authority reason expiry underlying automatic tier or immutable audit"
  - id: benefit_rate_mismatch
    rule: "a displayed tier rate reward access or fulfilment benefit differs from the executable published definition"
  - id: expiry_attribution_loss
    rule: "expiry or refund restoration loses the original tenant wallet programme version lot or earned-date attribution"
  - id: duplicate_expiry_notice
    rule: "an expiry reminder retry creates another delivery intent or ignores current consent suppression or policy"
  - id: untrusted_authority
    rule: "browser input Auth claims email domain or connector metadata grants tenant customer wallet tier override or value authority"
  - id: cross_tenant_exposure
    rule: "an unrelated tenant programme customer wallet tier fact decision override benefit or evidence becomes visible or mutable"
  - id: checkout_dependency
    rule: "WooCommerce checkout synchronously depends on the Hub worker entitlement tier evaluation expiry or benefit outcome"
  - id: disabled_state_stranded
    rule: "disabling advanced VIP hides history overrides progress expiry evidence or an already accepted tier benefit"
  - id: sensitive_evidence
    rule: "reusable signing material raw payload personal data private qualification facts or ledger metadata enters logs support output or evidence"
  - id: unexplained_or_unapproved_close
    rule: "any tier award expiry reminder liability tenancy or privacy difference approval artifact score floor or critical finding remains unresolved"
