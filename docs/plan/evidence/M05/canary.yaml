    evidence: "Merchant customer worker audit and support projections omit contacts, raw identities, private qualification facts, reusable authority, and ledger internals."
  - id: checkout_independence
    status: passed
    evidence: "WooCommerce checkout uses local native state and never waits for Hub tier evaluation, expiry, worker, entitlement, or benefit delivery."
