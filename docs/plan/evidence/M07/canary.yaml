automaticFails:
  - id: arbitrary_audience_sql
    rule: "an audience accepts arbitrary SQL browser tags unsupported facts unbounded candidates or customer-selected authority"
  - id: mixed_audience_snapshot
    rule: "one immutable audience snapshot mixes separately committed source states or changes historical membership after publication"
  - id: dst_schedule_drift
    rule: "campaign schedule or lifecycle changes because an invalid ambiguous or execution-time timezone instant is accepted"
  - id: budget_oversubscription
    rule: "global quantity points budget monetary liability or per-member capacity oversubscribes or partially allocates"
  - id: multiplier_stack_violation
    rule: "more than the highest-priority eligible multiplier applies or a fixed bonus stacks without explicit published permission"
  - id: duplicate_campaign_effect
    rule: "duplicate replay delayed delivery or concurrent processing creates another assignment capacity value native reward or reversal effect"
  - id: refund_compensation_gap
    rule: "a partial or full refund leaves any campaign ledger origin spendable or rewrites gross capacity or accepted history"
  - id: liability_understatement
    rule: "merchant-declared or stale monetary liability differs from the exact published fixed-discount face value currency or precision"
  - id: trigger_time_expiry_drift
    rule: "worker delay changes campaign point availability expiry qualification or historical programme evidence from the canonical trigger instant"
  - id: deterministic_retry_storm
    rule: "a deterministic contract authority selector or native-capability failure enters transient audience-wide retries instead of manual review"
  - id: selector_authority_drift
    rule: "a campaign uses unknown disabled cross-programme or later-incompatible rule tier reward or connector selectors"
  - id: cross_tenant_exposure
    rule: "an unrelated tenant programme audience campaign assignment capacity job ledger native reward or evidence becomes visible or mutable"
  - id: checkout_dependency
    rule: "WooCommerce checkout synchronously depends on the Hub worker entitlement audience campaign or native reward outcome"
  - id: accepted_work_stranded
    rule: "pausing disabling cancelling or rolling back campaigns hides or strands accepted assignments capacity value native work or required reversals"
  - id: sensitive_evidence
    rule: "reusable signing material coupon plaintext raw payload personal data assignments salts source references or private ledger metadata enters logs support output or evidence"
  - id: unexplained_or_unapproved_close
    rule: "any audience capacity campaign value refund native reward queue result tenancy or privacy difference approval artifact score floor or critical finding remains unresolved"
