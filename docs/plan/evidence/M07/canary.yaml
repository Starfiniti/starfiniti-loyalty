  - id: production_value_baseline
    status: pending
    evidence: "Read-only programme, audience, snapshot, campaign, assignment, capacity, job, ledger, lot, reward, lifecycle, result, and connector aggregates require capture."
  - id: disabled_deployment
    status: pending
    evidence: "Candidate images and additive migrations have not been deployed with campaigns disabled."
  - id: migration_registration
    status: pending
    evidence: "Production must record every candidate migration version and source digest exactly once before campaigns can be enabled."
  - id: non_canary_disabled
    status: pending
    evidence: "Unrelated organizations, workspaces, programmes, audiences, campaigns, customers, connectors, and sessions must receive no campaign capability."
  - id: audience_snapshot_canary
    status: pending
    evidence: "One allowlisted multi-condition audience must preview, publish, snapshot, and retain one immutable exact membership set without arbitrary SQL or identity exposure."
  - id: preview_liability_canary
    status: pending
    evidence: "Audience size, exclusions, points, quantity, monetary liability, member caps, and maximum exposure must match the published definition before approval."
  - id: approval_control_canary
    status: pending
    evidence: "An authorized approval must bind one immutable snapshot, exact treatment and control assignment, confirmed liability, schedule, programme selectors, and audit evidence."
  - id: schedule_dst_canary
    status: pending
    evidence: "Explicit instants and one valid IANA timezone must pass normal, daylight-saving gap, overlap, and boundary evidence without server-timezone drift."
  - id: lifecycle_canary
    status: pending
    evidence: "Database time must advance scheduled, active, paused, completed, and cancelled states once while allowing compatible successor versions."
  - id: bonus_points_canary
    status: pending
    evidence: "A bonus-point campaign must reserve capacity and append one attributable award and release at the canonical trigger instant."
  - id: multiplier_canary
    status: pending
    evidence: "Only the highest-priority eligible programme-or-campaign multiplier may apply while explicitly additive fixed bonuses retain separate attribution."
  - id: milestone_canary
    status: pending
    evidence: "A milestone campaign must use one canonical allowlisted fact, control assignment, exact cap, and exactly-once effect."
  - id: winback_canary
    status: pending
    evidence: "A win-back campaign must use bounded historical inactivity evidence and issue no effect outside its immutable snapshot and schedule."
  - id: tier_campaign_canary
    status: pending
    evidence: "A tier campaign must use the exact published programme tier selector and reject unknown, disabled, or later-incompatible programme changes."
  - id: referral_campaign_canary
    status: pending
    evidence: "A referral campaign must use canonical referral facts and create no duplicate or identity-derived effect."
  - id: limited_quantity_canary
    status: pending
    evidence: "A limited-quantity campaign must reserve before value, accept the last available unit, reject the next claim, and never partially allocate."
  - id: native_fixed_discount_canary
    status: pending
    evidence: "A campaign-funded fixed discount must derive exact face value, currency, precision, and active exact-programme connector capability before assignment."
  - id: last_capacity_canary
    status: pending
    evidence: "Concurrent treatment claims at the final quantity, points, and liability boundary must produce one winner, one exhausted outcome, and exact counters."
  - id: member_cap_canary
    status: pending
    evidence: "Concurrent and replayed effects for one member must enforce the immutable per-member cap without alternate trigger or ordering bypass."
  - id: control_group_canary
    status: pending
    evidence: "Deterministic private control assignment must create no value while treatment and control populations reconcile to the approved snapshot."
  - id: partial_full_refund_canary
    status: pending
    evidence: "Partial then full purchase refunds must cumulatively compensate every campaign ledger origin exactly once without refilling gross capacity."
  - id: audience_source_change_canary
    status: pending
    evidence: "A concurrent qualifying source change must fall entirely before or after one materialized audience statement snapshot and never mix decisions."
  - id: deterministic_failure_canary
    status: pending
    evidence: "A controlled selector, authority, contract, or native-capability failure must roll back and enter immediate minimized manual review after one attempt."
  - id: transient_retry_canary
    status: pending
    evidence: "A controlled transient infrastructure failure must retain accepted capacity, recover through bounded leased retries, and create one final effect."
  - id: programme_selector_compatibility
    status: pending
    evidence: "Campaign approval and competing programme publication must serialize so incompatible rule, tier, reward, or connector changes fail atomically."
  - id: cross_tenant_denial
    status: pending
    evidence: "Unrelated organization, programme, audience, campaign, assignment, capacity, job, wallet, reward, result, and connector selectors must reveal nothing and create no effect."
  - id: capacity_reconciliation
    status: pending
    evidence: "Quantity, points, liability, per-member use, treatment, control, reserved, fulfilled, reversed, exhausted, and suppressed counters must reconcile exactly."
  - id: ledger_reconciliation
    status: pending
    evidence: "Every point award, multiplier, bonus, release, lot, refund compensation, tier fact, balance, and campaign attribution must reconcile to canonical triggers."
  - id: native_reward_reconciliation
    status: pending
    evidence: "Every native command, fixed discount, reservation, capture, cancellation, redemption, retry, expiry, ambiguity, and monetary face value must reconcile exactly."
  - id: queue_result_reconciliation
    status: pending
    evidence: "No trigger job may be lost, duplicated, leased indefinitely, retried past bounds, hidden by disablement, or absent from exact minimized campaign results."
  - id: rollback_rehearsal
    status: pending
    evidence: "Pause and disable campaigns, drain or hold accepted work, restore prior images, and retain additive snapshots, assignments, capacity, value, native states, reversals, and results."
  - id: observation_window
    status: pending
    evidence: "Observe the bounded canary after rollback rehearsal and record schedule, audience, capacity, value, refund, native, queue, checkout, privacy, and reconciliation health."
  - id: final_reconciliation
    status: pending
    evidence: "Confirm zero unexplained audience, snapshot, campaign, assignment, capacity, control, value, refund, native reward, queue, result, checkout, tenancy, or privacy difference."
