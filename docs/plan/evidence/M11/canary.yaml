automaticFails:
  - id: implicit_sharing_authority
    rule: "wallet sharing customer linking workspace membership or programme topology is inferred from email domain organization membership mutable claims or browser selectors"
  - id: cross_tenant_exposure
    rule: "an unrelated tenant workspace customer rate credential endpoint event wallet ledger delivery or operational selector becomes visible mutable or externally actionable"
  - id: duplicate_ecosystem_effect
    rule: "retry concurrency replay rotation lease recovery or receiver replay creates another identity receipt event ledger quota endpoint delivery or downstream business effect"
  - id: historical_rate_drift
    rule: "caller-supplied processing-time refund-time or mutable current rate changes occurrence-bound conversion evidence award refund liability or analytics"
  - id: identity_merge_violation
    rule: "email attribute provider profile or unverified proof merges customer authority or links a wallet with incompatible existing value"
  - id: credential_or_secret_leak
    rule: "raw reusable service API webhook provider or signing material appears in database browser logs support evidence another process or an artifact"
  - id: webhook_destination_escape
    rule: "redirect DNS rebinding private reserved mixed answer unpinned socket or unbounded response reaches an internal or unapproved receiver"
  - id: quota_or_rate_bypass
    rule: "alternate credential route ordering concurrency or retry exceeds the exact fixed-minute quota provider bound payload size attempt ceiling or rate policy"
  - id: connector_or_history_stranding
    rule: "workspace removal unlink endpoint retirement disablement or rollback loses connector history identity provenance customer access immutable evidence or loyalty value"
  - id: ecosystem_value_dependency
    rule: "checkout ingestion refunds releases reconciliation balances promised rewards or existing redemption depends on ecosystem API currency provider or webhook availability"
  - id: client_contract_drift
    rule: "supported TypeScript PHP Service API or Standard Webhooks bytes signature timestamp replay identity or minimized payload diverges from the versioned server contract"
  - id: unsafe_rollout
    rule: "topology sharing linking conversion API credential endpoint or webhook is enabled outside the approved pilot before recovery baseline disabled deployment and isolation pass"
  - id: reconciliation_gap
    rule: "topology identity currency event ledger quota endpoint delivery audit analytics checkout or privacy evidence differs from immutable source facts"
  - id: sensitive_evidence
    rule: "contact identity raw payload reusable key signature coupon plaintext private selector rate-provider material or ledger metadata enters browser logs support output or evidence"
  - id: score_or_approval_bypass
    rule: "module status completion approval provider policy artifact score total or category floor is changed without exact synchronized evidence"
  - id: unexplained_or_unapproved_close
    rule: "any topology identity currency API webhook client value checkout privacy approval artifact score floor or critical finding remains unresolved"
