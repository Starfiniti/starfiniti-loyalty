automaticFails:
  - implicit wallet sharing or identity authority from email domain organization membership claims or browser selectors
  - cross-organization workspace customer rate credential endpoint or value authority
  - duplicate customer event ledger transaction quota receipt endpoint delivery or receiver business effect
  - mutable caller-supplied processing-time or refund-time rate changes historical value
  - raw reusable API webhook or provider material appears in database browser logs evidence or another process
  - connector removal unlink retirement or rollback strands history value customer access or immutable evidence
  - checkout ingestion refunds releases reconciliation or existing redemption depend on ecosystem or provider availability
  - unexplained topology identity currency event ledger quota delivery audit or analytical difference
  - approved release recovery point rollback observation or final reconciliation evidence is absent
  - critical security tenancy ledger privacy recovery accessibility or data-loss finding remains unresolved
