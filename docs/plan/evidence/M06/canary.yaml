automaticFails:
  - id: identity_or_channel_leak
    rule: "an advocate code share URL projection log or artifact exposes customer channel network payment or address identity"
  - id: self_referral_value
    rule: "a self-referral reaches attribution cooling qualification reward issuance or another value-bearing state"
  - id: multiple_advocate_attribution
    rule: "one referred customer or canonical order becomes attributed to more than one advocate or programme policy"
  - id: browser_authority
    rule: "browser input Auth claims email domain share parameters or connector metadata grants tenant customer referral or value authority"
  - id: early_referral_value
    rule: "advocate or friend value issues before paid minimum new-customer cooling and review requirements all pass"
  - id: duplicate_referral_effect
    rule: "duplicate replay delayed delivery or concurrent processing creates another attribution transition reward or compensation effect"
  - id: partial_give_get
    rule: "advocate and friend rewards or their refund compensation commit partially or reconcile to different canonical referral evidence"
  - id: refund_retains_value
    rule: "a qualifying refund fails to cancel value-neutral work or compensate each issued referral side exactly once"
  - id: fraud_review_bypass
    rule: "a held or uncertain referral issues value without a live authorized reason-bound immutable review decision"
  - id: unbounded_recovery
    rule: "fraud or reward recovery resets cumulative attempt identity exceeds its hard ceiling or hides terminal manual review"
  - id: fraud_data_overretention
    rule: "raw identity network payment shipping evidence or purpose-separated fingerprints survive beyond the bounded private retention policy"
  - id: cross_tenant_exposure
    rule: "an unrelated tenant programme customer attribution review job ledger effect fingerprint or evidence becomes visible or mutable"
  - id: checkout_dependency
    rule: "WooCommerce checkout synchronously depends on the Hub worker entitlement attribution fraud review or referral reward outcome"
  - id: accepted_work_stranded
    rule: "disabling referrals hides or strands an accepted attribution cooling review reward job or required compensation"
  - id: sensitive_evidence
    rule: "reusable signing material raw payload personal data fingerprint values or private ledger metadata enters logs support output or evidence"
  - id: unexplained_or_unapproved_close
    rule: "any attribution review job reward ledger funnel fraud tenancy or privacy difference approval artifact score floor or critical finding remains unresolved"
