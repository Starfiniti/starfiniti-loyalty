automaticFails:
  - unexplained ledger projection report export schedule or capability difference
  - cross-organization access or authority derived from browser input or mutable identity claims
  - duplicate export schedule materialization download consumption or immutable business effect
  - report output exposes row-level identity contact coupon signing or private operational evidence
  - influenced revenue is labelled incremental without complete treatment-control estimator evidence
  - checkout value refunds reconciliation or provider processing depends on analytics or reporting availability
  - large integer currency timezone cohort or refund arithmetic loses exact source meaning
  - approved release recovery point rollback reconciliation or observation evidence is absent
  - critical security privacy accessibility recovery or data-loss finding remains unresolved
