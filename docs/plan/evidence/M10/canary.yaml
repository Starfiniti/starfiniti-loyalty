automaticFails:
  - id: mutable_projection_truth
    rule: "a mutable wallet aggregate current programme state or browser-computed value replaces immutable ledger commerce programme or assignment evidence"
  - id: cross_tenant_exposure
    rule: "an unrelated organization workspace programme report export schedule payload capability cohort or operational selector becomes visible mutable or consumable"
  - id: arithmetic_precision_loss
    rule: "large integer decimal currency timezone refund cohort rate or rational estimator arithmetic loses exact source meaning or changes across layers"
  - id: causal_claim_overreach
    rule: "influenced revenue observation or incomplete treatment-control evidence is labelled incremental predictive significant or accounting revenue"
  - id: duplicate_report_effect
    rule: "retry concurrency schedule materialization lease recovery or capability consumption creates another export payload download or immutable business result"
  - id: private_export_leak
    rule: "report export download audit log support output or evidence exposes row-level identity contact coupon assignment signing capability or private operational data"
  - id: capability_replay
    rule: "another subject session tenant expired capability revoked actor or replay consumes or reconstructs private report content"
  - id: snapshot_divergence
    rule: "one analytics command center mixes invalid future stale-without-warning or materially different source instants across its four reports"
  - id: unbounded_reporting_load
    rule: "period series payload candidate schedule lease retry response or database statement exceeds its declared bound or starves protected value processing"
  - id: analytics_value_dependency
    rule: "checkout awards refunds releases reservations reconciliation notifications or provider processing depends on analytics report export schedule or worker availability"
  - id: accepted_work_stranded
    rule: "disablement rollback expiry or prior-image recovery hides deletes or strands accepted export schedule job payload capability audit or required reconciliation"
  - id: unsafe_rollout
    rule: "analytics migration navigation entitlement schedule or reporting worker is enabled outside the approved pilot before recovery baseline and disabled-deployment checks pass"
  - id: reconciliation_gap
    rule: "ledger projection commerce programme cohort export schedule payload capability or customer aggregate differs from immutable source evidence"
  - id: sensitive_evidence
    rule: "contact identity raw payload capability reusable signing material coupon plaintext private selector or ledger metadata enters browser logs support output or evidence"
  - id: score_or_approval_bypass
    rule: "module status completion approval artifact score total category floor metric limitation or unavailable state is changed without exact synchronized evidence"
  - id: unexplained_or_unapproved_close
    rule: "any metric source report export schedule capability latency privacy tenancy value checkout approval artifact score floor or critical finding remains unresolved"
