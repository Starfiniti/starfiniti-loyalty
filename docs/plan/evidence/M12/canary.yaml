automaticFails:
  - id: duplicate_import_effect
    rule: "retry concurrency replay recovery or correction creates another customer wallet lot ledger entry opening transaction receipt batch release correction or business effect"
  - id: identity_authority_violation
    rule: "customer authority is inferred from email name address domain profile metadata source content or browser input"
  - id: cross_tenant_exposure
    rule: "an unrelated organization source receipt customer wallet programme ledger migration batch or operational selector becomes visible mutable or externally actionable"
  - id: sensitive_source_retention
    rule: "raw source bytes identity contact unrelated columns reusable capability or ledger metadata enters database logs URLs analytics errors captures support output or evidence"
  - id: approval_or_fingerprint_drift
    rule: "receipt approval application correction source adapter fingerprint mapping total or policy proceeds with unresolved stale changed mismatched or browser-supplied evidence"
  - id: immutable_ledger_violation
    rule: "an imported balance overwrites edits deletes or bypasses an existing ledger transaction lot wallet projection source history or compensating correction"
  - id: unsupported_source_or_format
    rule: "an unknown changed undocumented unavailable or unapproved source adapter version file shape or identity mapping reaches parsing or value application"
  - id: migration_value_dependency
    rule: "checkout ingestion refunds releases reconciliation balances promised rewards existing redemption correction or customer access depends on migration availability"
  - id: unsafe_rollout
    rule: "migration inspection application or correction is enabled outside the approved source batch before recovery baseline disabled deployment and isolation pass"
  - id: reconciliation_gap
    rule: "customer identity balance lot expiry liability transaction receipt batch correction audit checkout or privacy evidence differs from immutable source facts"
  - id: destructive_rollback
    rule: "rollback deletes additive evidence edits imported value strands customer access or fails to compensate the exact approved canary batch"
  - id: score_or_approval_bypass
    rule: "module status completion approval source policy artifact score total or category floor is changed without exact synchronized evidence"
  - id: unexplained_or_unapproved_close
    rule: "any source identity value expiry liability traceability correction checkout privacy approval artifact score floor or critical finding remains unresolved"
