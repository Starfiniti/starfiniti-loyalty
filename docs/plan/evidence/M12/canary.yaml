automaticFails:
  - duplicate customer wallet lot ledger entry opening transaction receipt batch release correction or business effect
  - customer authority inferred from email name address domain profile metadata or browser input
  - cross-organization source receipt customer wallet programme ledger or migration access
  - raw source bytes identity contact or unrelated columns retained in database logs URLs analytics errors captures or evidence
  - receipt approval application or correction proceeds with unresolved stale changed or mismatched evidence
  - imported balance overwrites or edits an existing ledger transaction lot wallet projection or source history
  - checkout ingestion refunds releases reconciliation or existing redemption depends on migration availability
  - unexplained customer balance expiry liability transaction lot receipt batch audit or privacy difference
  - approved release recovery point source canary correction rollback observation or final reconciliation evidence is absent
  - critical security tenancy ledger privacy recovery accessibility or data-loss finding remains unresolved
