  - id: M08-NOTIFICATIONS
    title: Add provider-neutral notifications, SMTP, Klaviyo, and webhooks
    module: M08
    status: in_progress
    module_score: 90
    dependencies: [M07-CAMPAIGNS]
    hypothesis: Consent-aware asynchronous messages improve activation without coupling providers to value processing.
    baseline: Expiry notification scheduling exists without provider delivery; Klaviyo is deferred in current docs.
    targets:
      [
        withdrawal is immediate,
        duplicate event sends once,
        provider outage cannot affect value or checkout,
      ]
    owner_inputs:
      [
        approved release and bounded pilot window,
        Klaviyo credentials for managed canary,
        SMTP credentials for deployment canary,
      ]
    acceptance:
      [
        event contracts consent suppression templates dedupe schedules retries dead letters SMTP Klaviyo webhooks and health pass,
      ]
    failure_modes:
      [
        send after withdrawal,
        PII or coupon in logs,
        provider becomes authority,
        retry storm,
      ]
    rollout: Local sink, then test provider, then Starfiniti tenant per channel/purpose.
    rollback: Disable provider dispatch while retaining provider-neutral queued evidence and value processing.
    verification:
      [
        contract and provider-sink tests,
        replay/outage tests,
        privacy scan,
        webhook verification,
        template browser QA,
      ]
    slices:
      - id: M08-S01-EVENT-CONSENT-AUTHORITY
        status: completed
        acceptance:
          - strict English-only provider-neutral events cover points rewards tiers referrals campaigns connector health and billing without arbitrary properties PII coupon plaintext or ledger metadata
          - Auth-derived customer preferences separate loyalty transactional and loyalty marketing purposes while private provider suppression remains independently authoritative
          - exact event and preference retries are idempotent conflicts fail closed customer erasure suppresses both purposes and point-expiry scheduling appends one canonical notification event
          - direct table access cross-tenant selectors unsupported state transitions malformed payloads and attempts to clear provider suppression from a customer session fail closed
        evidence:
          - docs/architecture/ADR/0031-provider-neutral-notification-events-and-local-consent-authority.md records current official Supabase PostgreSQL and Klaviyo research alternatives and rollback consequences
          - NotificationEventV1 and PostgreSQL independently enforce nine exact English event payloads Auth-derived purpose preferences stronger trusted suppression immutable idempotency privacy-erasure suppression and point-expiry dual-write without external delivery
          - exact-head run 32682221777 at 33e0396 passed the complete baseline both images clean 48-migration replay all 39 pgTAP files with 2066 assertions including 50 focused notification assertions every concurrency probe and all four WooCommerce runtime cells after a transient upstream package-download 504 was retried
      - id: M08-S02-SMTP-DELIVERY
        status: completed
        acceptance:
          - self-hosted transactional email uses verified contact resolution versioned English templates bounded leases and a real local SMTP sink
          - withdrawal and suppression are rechecked at dispatch authorization duplicate events send once and provider outage never affects value processing
        evidence:
          - ADR-0032 selects a separate optional notification worker database-owned lease and retry state late verified Auth contact resolution immutable English templates and manual review for ambiguous SMTP acceptance
          - exact-head run 32686442063 at 604bbeb passed the complete baseline both production images a clean 49-migration replay all 40 pgTAP files with 2152 assertions including all 86 focused SMTP assertions every concurrency probe and all four WooCommerce runtime cells
          - 46 worker tests include 16 focused SMTP tests and a real loopback SMTP sink with deterministic event Message-ID dispatch-time authority conservative ambiguity handling and terminal classification for deterministic local message failures
      - id: M08-S03-KLAVIYO
        status: completed
        acceptance:
          - managed Klaviyo profile event and consent synchronization pins an API revision unique IDs retry-after handling and minimized fields without becoming authority
          - one managed organization is bound to one provider connection and connection-specific scrypt V2 API-key fingerprint before verified contact can leave the database
          - local consent withdrawal is rechecked at action authorization provider suppression can only tighten local eligibility and ambiguous opt-in never auto-retries
          - exact event and unsubscribe retries converge duplicate provider events use the immutable event UUID and provider outage cannot affect value processing or checkout
        failure_modes:
          - tenant selector and provider key are mismatched
          - a fast provider-key digest or fingerprint not bound to the exact connection creates a reusable offline oracle
          - browser or Auth metadata becomes provider or tenant authority
          - provider unsubscribe or suppression is silently cleared
          - subscribe ambiguity sends repeated double-opt-in messages
          - 202 is reported as delivered rather than accepted
          - raw contact event secret or provider error body is persisted or logged
        rollout: Deploy private schema and disabled worker first then derive the V2 fingerprint with the exact release command bind one managed pilot tenant and connection to a least-scope test key and reconcile a bounded canary.
        rollback: Stop the isolated worker or disable its connection while retaining provider-neutral facts and immutable provider evidence; a V1 image requires the prior disabled-row fingerprint and both algorithms are never accepted concurrently; never reverse consent remotely during rollback.
        verification:
          - contract tests for minimized claims authorizations provider responses and contact-smuggling rejection
          - pgTAP for grants tenant-key binding late consent and entitlement checks supersession suppression lease expiry replay and immutable evidence
          - local HTTP sink tests for profile event subscribe unsubscribe 429 503 timeout bounded bodies and pre/post-action worker death
          - exact-head baseline database replay images WooCommerce matrix secret scan and disabled deployment smoke
        evidence:
          - docs/architecture/ADR/0033-tenant-bound-klaviyo-projection-and-consent-sync.md
          - docs/architecture/ADR/0099-extension-aware-sast-and-tenant-bound-provider-credential-kdf.md
          - docs/operations/KLAVIYO.md
      - id: M08-S04-SIGNED-WEBHOOKS
        status: completed
        acceptance:
          - generic outbound webhooks are destination-allowlisted HMAC-signed replay-safe rotatable rate-limited and payload-minimized
          - one endpoint-bound worker emits the Standard Webhooks v1 id timestamp and exact-body signatures with an optional time-bounded previous signature
          - HTTPS destination DNS answers are public and socket-pinned redirects are rejected and loopback HTTP exists only in explicit test mode
          - current entitlement purpose consent endpoint subscription lease payload size and secret fingerprints are rechecked immediately before dispatch
        failure_modes:
          - tenant endpoint or current and previous secret fingerprints are mismatched
          - DNS rebinding redirect or encoded private address reaches an internal service
          - retry changes the webhook id or signs bytes different from those transmitted
          - withdrawn or suppressed customer events leave the database
          - endpoint throughput payload response or retry schedule is unbounded
          - raw destination payload response signature contact or secret appears in logs or evidence
        rollout: Deploy private schema and disabled endpoint-isolated worker first then verify an exact local sink before any reviewed HTTPS receiver is enabled.
        rollback: Stop or disable the endpoint while retaining immutable events delivery attempts and stable delivery IDs; reconcile manual-review attempts before replay.
        verification:
          - contract tests for strict event envelopes claims authorizations URL constraints and contact-smuggling rejection
