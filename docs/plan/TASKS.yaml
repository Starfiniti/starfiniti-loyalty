  - id: M12-MIGRATION
    title: Add traceable, idempotent loyalty migration
    module: M12
    status: in_progress
    module_score: 90
    dependencies: [M11-ECOSYSTEM]
    hypothesis: Fingerprinted dry runs and opening-balance ledger effects migrate customers without duplicate or untraceable value.
    baseline: No supported import framework or competitor adapter exists.
