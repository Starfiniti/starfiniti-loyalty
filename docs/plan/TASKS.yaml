      - id: M11-S02-EXPLICIT-CROSS-WORKSPACE-CUSTOMER-LINKING
        status: complete
        hypothesis: Two fresh store-signed customer proofs bound to one live Auth subject can safely establish shared-wallet identity without treating email organization membership or a browser selector as identity authority.
