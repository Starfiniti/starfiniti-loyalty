    slices:
      - id: M12-S01-CANONICAL-IMPORT-AND-DRY-RUN
        status: complete
        hypothesis: A vendor-neutral canonical document plus explicit identity resolutions can produce one deterministic value-free approval receipt without retaining raw exports or merging customers by email.
        baseline: The repository has immutable ledger and bounded bulk-adjustment primitives but no migration contracts domain validation source fingerprints receipt persistence or adapter boundary.
        owner_inputs: []
        metrics:
          - duplicate source identities accepted = 0
          - duplicate existing-customer targets accepted = 0
          - email-derived automatic matches = 0
          - raw source identities persisted in receipt or audit = 0
          - dry-run ledger customer wallet lot tier referral coupon connector or event effects = 0
          - exact reruns creating another content receipt = 0
        targets:
          - canonical documents and resolutions are bounded versioned and deterministic
          - all row counts bucket totals exact lots and disposition counts reconcile
          - PostgreSQL derives actor tenant role programme version entitlement and final receipt hash
          - invalid unresolved ambiguous duplicated or fingerprint-drifted documents fail closed before approval
        acceptance:
          - V1 represents source provenance identities available and pending balances exact lots/expiry tier referral and bounded source history
          - preserve_exact requires lot reconciliation while apply_default binds one reviewed future expiry and rejects mixed lot evidence
          - email can exist only as transient source evidence and no resolution basis can grant authority from email matching
          - the domain dry run is independent of resolution input order and changes when any document balance identity mapping or policy changes
          - immutable RLS receipts retain only hashes counts totals aggregate issue codes actor/correlation and database approval evidence
          - exact idempotency and content retries return one receipt changed reuse conflicts and every path creates zero loyalty value
        failure_modes:
          - vendor format becomes the internal database schema
          - caller supplies organization actor customer wallet or ledger authority
          - same person is inferred from email name address domain or profile metadata
          - source rows or target customers appear more than once
          - approval hash omits expiry mapping balance issue or programme evidence
          - raw export identity history or errors enter PostgreSQL audit logs or browser results
          - a dry run calls a value customer connector or provider mutation
        security_boundaries:
          - raw vendor and canonical row payloads exist only transiently in bounded server validation and never in S01 database evidence
          - PostgreSQL accepts public programme selectors and minimized deterministic results then derives live Auth organization role entitlement and published version
          - only live owner/admin can record while auditor is RLS read-only and all other or revoked/cross-tenant roles fail closed
          - a receipt cannot authorize value; S02 must re-present and independently verify every exact row and mapping
        rollout: Deploy the additive receipt boundary disabled for managed tenants, record invalid then valid Starfiniti documents, verify minimization and zero effects, and enable later application separately.
        rollback: Stop the record command and hide the workflow while preserving immutable value-free receipts and audits; no customer or ledger compensation is required for S01.
        verification:
